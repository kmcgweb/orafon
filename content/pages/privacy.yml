th:
  title: นโยบายความเป็นส่วนตัว
  updated: 2026-09-23
  body: |
    บริษัท โอราโนส จำกัด ("บริษัท") ให้ความสำคัญกับการคุ้มครองข้อมูลส่วนบุคคลของท่านตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562 (PDPA)

    ## ข้อมูลที่เราเก็บ
    เมื่อท่านส่งแบบฟอร์มขอใบเสนอราคาหรือติดต่อเรา เราจะเก็บข้อมูลที่ท่านกรอก ได้แก่ ชื่อ บริษัท เบอร์โทรศัพท์ อีเมล และรายละเอียดที่ท่านสอบถาม

    ## วัตถุประสงค์
    เราใช้ข้อมูลเพื่อติดต่อกลับ จัดทำใบเสนอราคา และให้บริการที่ท่านร้องขอเท่านั้น เราจะไม่ขายหรือเปิดเผยข้อมูลของท่านให้บุคคลภายนอกเพื่อการตลาด

    ## ระยะเวลาการเก็บ
    เราเก็บข้อมูลเท่าที่จำเป็นต่อการให้บริการและตามที่กฎหมายกำหนด

    ## สิทธิของท่าน
    ท่านมีสิทธิขอเข้าถึง แก้ไข ลบ หรือคัดค้านการประมวลผลข้อมูลส่วนบุคคลของท่าน โดยติดต่อบริษัทตามช่องทางในหน้า "ติดต่อเรา"

    ## คุกกี้
    เว็บไซต์นี้ไม่ใช้คุกกี้เพื่อการติดตามหรือโฆษณา
en:
  title: Privacy Policy
  body: |
    Oranoss Co., Ltd. ("the Company") respects your privacy and protects your personal data in accordance with Thailand's Personal Data Protection Act B.E. 2562 (PDPA).

    ## Data we collect
    When you submit a quotation request or contact form, we collect the details you provide: name, company, phone number, email and your enquiry.

    ## Purpose
    We use this data only to reply to you, prepare quotations and provide the services you request. We do not sell or disclose your data to third parties for marketing.

    ## Retention
    We keep data only as long as necessary to provide the service and as required by law.

    ## Your rights
    You may request access to, correction or deletion of, or object to the processing of your personal data by contacting us through the Contact page.

    ## Cookies
    This website does not use tracking or advertising cookies.
