th:
  title: เราคือ
  highlight: ORAFON
  lead: ORAFON เป็นแบรนด์สารทำความเย็นของ บริษัท โอราโนส จำกัด และเป็นตัวแทนจำหน่าย Solstice® เรามุ่งให้ข้อมูลทางเทคนิคที่ถูกต้อง เพื่อช่วยให้ช่างและผู้รับเหมาเลือกสารทำความเย็นได้เหมาะกับงาน ทั้งด้านประสิทธิภาพ ความปลอดภัย และสิ่งแวดล้อม
  cards:
    - title: พันธกิจของเรา
      text: ส่งมอบสารทำความเย็นคุณภาพและคำแนะนำที่เชื่อถือได้ ช่วยลูกค้าวางแผนระบบอย่างคุ้มค่าและยั่งยืน
    - title: แบรนด์ ORAFON
      text: สารทำความเย็นแบรนด์ของเรา ครอบคลุมเบอร์น้ำยาที่ใช้งานบ่อยในงานปรับอากาศและทำความเย็น
    - title: ตัวแทนจำหน่าย Solstice®
      text: จัดจำหน่ายสารทำความเย็นเทคโนโลยี HFO จาก Solstice® Advanced Materials
    - title: ส่งออกต่างประเทศ
      text: รับคำสั่งซื้อจากลูกค้าต่างประเทศ ติดต่อทีมงานเพื่อสอบถามสินค้า ขนาดบรรจุ และเงื่อนไขการส่งออก
    - title: ใส่ใจสิ่งแวดล้อม
      text: สนับสนุนการเปลี่ยนผ่านสู่สารทำความเย็น GWP ต่ำ ลดผลกระทบต่อภาวะโลกร้อน
  history_show: false
  history_title: ประวัติความเป็นมา
  history_lead: บริษัท โอราโนส จำกัด เจ้าของแบรนด์ ORAFON อยู่ในเครือ เค.เอ็ม. กรุ๊ป ซึ่งดำเนินธุรกิจนำเข้าและจัดจำหน่ายเคมีอุตสาหกรรม ทั้งโซลเว้นท์ น้ำยาแอร์ ผลิตภัณฑ์ฆ่าเชื้อและทำความสะอาด รวมถึงวัตถุดิบทางเคมีอีกหลายชนิด
  history:
    - year: "2539"
      title: เริ่มต้น เค.เอ็ม. กรุ๊ป
      text: ก่อตั้งบริษัท สเตชันเนอรี สแควร์ จำกัด
    - year: "2540"
      title: บริษัท เคเอ็มเคมิคอล คอร์ปอเรชัน จำกัด
      text: เปลี่ยนชื่อบริษัท และนำเข้าจัดจำหน่ายจารบีแบรนด์ BECHEM จากประเทศเยอรมนี ซึ่งใช้กันแพร่หลายในอุตสาหกรรมยา อาหาร และอิเล็กทรอนิกส์
    - year: "2546"
      title: ก่อตั้งบริษัท โอราโนส จำกัด
      text: ผู้นำเข้าและจัดจำหน่ายผลิตภัณฑ์หล่อลื่น SK ZIC แต่เพียงผู้เดียวในประเทศไทย และบุกเบิกธุรกิจสารทำความเย็นภายใต้แบรนด์ ORAFON
    - year: "2551"
      title: บริษัท เคเอ็ม อินโนเวท (1996) จำกัด
      text: นำเข้าและจัดจำหน่ายน้ำยาฆ่าเชื้อแบรนด์ Amity สำหรับโรงพยาบาลและอุตสาหกรรมอาหาร
    - year: "2552"
      title: ได้รับการรับรอง ISO 9001
      text: โอราโนสได้รับการรับรองระบบบริหารงานคุณภาพ ISO 9001 สร้างความมั่นใจให้ลูกค้าทั้งในประเทศและต่างประเทศ
    - year: "2556"
      title: บริษัท นพเก้า จำกัด
      text: ขยายตลาดเคมีภัณฑ์สู่ลูกค้าต่างประเทศในภูมิภาคเอเชียใต้
    - year: "2562"
      title: บริษัท รูบิคอน ดิสทริบิวชั่น จำกัด
      text: บริการขนส่งสินค้าภายในประเทศ พร้อมพื้นที่คลังสินค้าให้เช่า
    - year: "2565"
      title: รับรอง ISO 9001 อีกครั้ง
      text: ยืนยันมาตรฐานระบบบริหารงานคุณภาพ ISO 9001 อย่างต่อเนื่อง
    - year: "2569"
      title: เปิดเว็บไซต์ orafon.co.th
      text: รวมข้อมูลสินค้า ORAFON และ Solstice® พร้อมข้อมูลทางเทคนิคไว้ในที่เดียว
  quality_title: คุณภาพที่ตรวจสอบได้
  quality_lead: ผู้นำเข้าและจัดจำหน่ายสารทำความเย็นและเคมีภัณฑ์ ที่มีฐานการผลิตจากแหล่งผลิตระดับโลก ได้รับการรับรองมาตรฐาน ISO 9001:2015 และยึดมั่นในมาตรฐานคุณภาพผลิตภัณฑ์ AHRI 700 (2019) ด้วยการใช้เทคโนโลยีการตรวจสอบคุณภาพให้เป็นไปตามมาตรฐานระดับสากล
  quality_badges:
    - ISO 9001:2015
    - AHRI 700 (2019)
  quality_quote: เราส่งมอบผลิตภัณฑ์ที่ดีที่สุด เพื่อคุณ
  lab_title: เครื่องมือตรวจสอบคุณภาพ
  lab_lead: เรามุ่งเน้นการเพิ่มมูลค่าให้กับผลิตภัณฑ์ด้วยบริการที่สมบูรณ์ในทุกด้าน และไม่นำเข้าน้ำยาแอร์ที่ไม่ผ่านการตรวจสอบตามมาตรฐานเข้ามาจำหน่าย
  lab:
    - title: Gas Chromatography
      featured: true
      image: /assets/uploads/lab/gas-chromatography.webp
      text: ตรวจค่าความบริสุทธิ์และสารปนเปื้อนในน้ำยาแอร์ 2 ค่าหลัก
      points:
        - title: Purity Test
          text: ตรวจความบริสุทธิ์ของน้ำยาแอร์ว่าตรงตามที่ผู้ผลิตระบุ เพราะน้ำยาอาจมีสารปลอมปนหรือส่วนผสมไม่ตรงตามที่ระบุไว้
        - title: Non-Condensable Test
          text: ตรวจวัดสารที่ไม่ควบแน่น เช่น อากาศ ไนโตรเจน และออกซิเจน ที่ปนอยู่ในน้ำยาแอร์ สารเหล่านี้ส่งผลต่ออุปกรณ์ในระบบปรับอากาศและทำให้เกิดการกัดกร่อน
    - title: Coulometer
      image: /assets/uploads/lab/coulometer.webp
      text: ตรวจวัดปริมาณความชื้น (Moisture) ที่ปนเปื้อนในสารทำความเย็นด้วยวิธี Karl Fischer แบบ Coulometric ซึ่งละเอียดถึงระดับ ppm (ส่วนในล้านส่วน) ความชื้นเพียงเล็กน้อยก็ทำให้ระบบเสียหายได้ การตรวจความชื้นจึงเป็นหัวใจของคุณภาพน้ำยาแอร์
      points:
        - title: ป้องกันน้ำแข็งอุดตัน
          text: ความชื้นจะกลายเป็นน้ำแข็งที่วาล์วลดแรงดันหรือท่อ Capillary ทำให้น้ำยาไหลไม่สะดวกและความเย็นลดลง
        - title: ป้องกันกรดกัดกร่อน
          text: ความชื้นทำปฏิกิริยากับน้ำยาและน้ำมันคอมเพรสเซอร์ เช่น POE และ PVE จนเกิดกรด กัดกร่อนชิ้นส่วนโลหะและฉนวนมอเตอร์ของคอมเพรสเซอร์
        - title: ยืดอายุระบบ
          text: น้ำยาที่แห้งตามมาตรฐานช่วยให้คอมเพรสเซอร์ทำงานได้เต็มประสิทธิภาพและใช้งานได้ยาวนาน ลดงานซ่อมบำรุง
    - title: Refrigerant Analyzer
      image: /assets/uploads/lab/refrigerant-analyzer.webp
      text: วิเคราะห์และระบุชนิดของสารทำความเย็น พร้อมแสดงส่วนผสมเป็นเปอร์เซ็นต์ได้อย่างแม่นยำและรวดเร็ว รู้ผลภายในไม่กี่นาที เป็นด่านแรกที่ช่วยคัดกรองให้ลูกค้าได้น้ำยาตรงตามฉลาก
      points:
        - title: ยืนยันชนิดน้ำยา
          text: ตรวจว่าน้ำยาในถังเป็นเบอร์เดียวกับที่ระบุบนฉลาก ป้องกันน้ำยาปลอมหรือบรรจุผิดเบอร์
        - title: ตรวจสัดส่วนน้ำยาผสม
          text: น้ำยาผสม (Blend) เช่น R-410A และ R-404A ต้องมีสัดส่วนตรงตามสูตร ถ้าเพี้ยนจะทำให้แรงดันและความเย็นไม่ตรงตามที่ออกแบบ
        - title: คัดกรองสารปนเปื้อน
          text: ตรวจพบสารแปลกปลอม เช่น น้ำยาเบอร์อื่นหรือสาร Hydrocarbon ที่ไวไฟ ก่อนถึงมือลูกค้า
  clients_title: กลุ่มลูกค้าที่ไว้วางใจ ORAFON
  clients_lead: ORAFON เป็นที่ยอมรับอย่างกว้างขวางในกลุ่มผู้ผลิตเครื่องปรับอากาศและเครื่องใช้ไฟฟ้า
  clients:
    - { name: LG, logo: /assets/uploads/clients/lg.svg }
    - { name: SAMSUNG, logo: /assets/uploads/clients/samsung.svg }
    - { name: Mitsubishi Heavy Industries, logo: /assets/uploads/clients/mitsubishi-heavy.svg }
    - { name: Electrolux, logo: /assets/uploads/clients/electrolux.svg }
    - { name: TOSHIBA, logo: /assets/uploads/clients/toshiba.svg }
    - { name: HITACHI, logo: /assets/uploads/clients/hitachi.svg }
    - { name: SHARP, logo: /assets/uploads/clients/sharp.svg }
    - { name: Beko, logo: /assets/uploads/clients/beko.svg }
    - { name: Carrier, logo: /assets/uploads/clients/carrier.svg }
    - { name: Midea, logo: /assets/uploads/clients/midea.svg }
    - { name: Haier, logo: /assets/uploads/clients/haier.svg }
  body: ""
en:
  title: We are
  lead: ORAFON is the refrigerant brand of Oranoss Co., Ltd. and an authorized distributor of Solstice®. We focus on accurate technical information so technicians and contractors can choose the right refrigerant for performance, safety and the environment.
  cards:
    - title: Our mission
      text: Deliver quality refrigerants and trustworthy advice that help customers plan cost-effective, sustainable systems.
    - title: The ORAFON brand
      text: Our own refrigerant brand, covering the most widely used grades for air-conditioning and refrigeration.
    - title: Solstice® distributor
      text: We distribute HFO-technology refrigerants from Solstice® Advanced Materials.
    - title: Export worldwide
      text: We supply customers outside Thailand. Contact our team about products, pack sizes and export terms.
    - title: Caring for the environment
      text: We support the transition to low-GWP refrigerants to reduce climate impact.
  history_title: Our history
  history_lead: Oranoss Co., Ltd., owner of the ORAFON brand, is part of K.M. Group, which imports and distributes industrial chemicals including solvents, refrigerants, disinfection and cleaning products, and many chemical raw materials.
  history:
    - year: "1996"
      title: K.M. Group begins
      text: Stationery Square Co., Ltd. is founded.
    - year: "1997"
      title: KM Chemical Corporation Co., Ltd.
      text: The company is renamed and begins importing BECHEM greases from Germany, widely used in the pharmaceutical, food and electronics industries.
    - year: "2003"
      title: Oranoss Co., Ltd. is founded
      text: Sole importer and distributor of SK ZIC lubricants in Thailand, and the start of the ORAFON refrigerant business.
    - year: "2008"
      title: KM Innovate (1996) Co., Ltd.
      text: Imports and distributes Amity disinfectants for hospitals and the food industry.
    - year: "2009"
      title: ISO 9001 certified
      text: Oranoss is certified to the ISO 9001 quality management standard, giving customers in Thailand and abroad added confidence.
    - year: "2013"
      title: Noppakao Co., Ltd.
      text: Expands chemical sales to customers in South Asia.
    - year: "2019"
      title: Rubicon Distribution Co., Ltd.
      text: Domestic transport services and warehouse space for rent.
    - year: "2022"
      title: ISO 9001 certified again
      text: Continued certification to the ISO 9001 quality management standard.
    - year: "2026"
      title: orafon.co.th launches
      text: ORAFON and Solstice® products and technical data in one place.
  quality_title: Quality you can verify
  quality_lead: We import and distribute refrigerants and chemicals made by world-class manufacturers. We are certified to ISO 9001:2015 and follow the AHRI 700 (2019) product quality standard, using modern testing technology to meet international standards.
  quality_quote: We deliver the best products for you
  lab_title: Quality testing equipment
  lab_lead: We add value to every product with complete service, and we never import refrigerant that has not passed standard quality testing.
  lab:
    - title: Gas Chromatography
      featured: true
      image: /assets/uploads/lab/gas-chromatography.webp
      text: Tests refrigerant purity and contamination on two key values.
      points:
        - title: Purity Test
          text: Confirms the refrigerant matches the manufacturer's specification, since refrigerant can be adulterated or have a different composition from the label.
        - title: Non-Condensable Test
          text: Measures non-condensable gases such as air, nitrogen and oxygen in the refrigerant, which harm air-conditioning components and cause corrosion.
    - title: Coulometer
      image: /assets/uploads/lab/coulometer.webp
      text: Measures moisture contamination in refrigerant by coulometric Karl Fischer titration, down to ppm (parts per million). Even a trace of water can damage a system, so moisture testing is at the heart of refrigerant quality.
      points:
        - title: Prevents ice blockage
          text: Moisture freezes at the expansion valve or capillary tube, restricting flow and reducing cooling.
        - title: Prevents acid corrosion
          text: Water reacts with refrigerant and compressor oils such as POE and PVE to form acids that attack metal parts and the compressor motor insulation.
        - title: Longer system life
          text: Refrigerant that meets dryness standards keeps the compressor running efficiently for longer, with less maintenance.
    - title: Refrigerant Analyzer
      image: /assets/uploads/lab/refrigerant-analyzer.webp
      text: Identifies the refrigerant type and reports the blend composition in percent, quickly and accurately, with results in minutes. It is the first line of screening so customers receive exactly what the label says.
      points:
        - title: Confirms the refrigerant
          text: Checks that the cylinder holds the grade on its label, guarding against counterfeit or mis-filled refrigerant.
        - title: Checks blend ratios
          text: Blends such as R-410A and R-404A must match their formulation; an off-ratio blend gives the wrong pressures and cooling.
        - title: Screens out contaminants
          text: Detects foreign substances, such as other refrigerant grades or flammable hydrocarbons, before they reach the customer.
  clients_title: Trusted by leading manufacturers
  clients_lead: ORAFON is widely trusted by air-conditioner and appliance manufacturers.
