en:
  summary: A single-component, non-flammable (A1) HFC with a very low boiling point, used for ultra-low-temperature refrigeration such as the low stage of cascade systems, laboratory freezers and test chambers. Very high GWP.
  applications:
    - icon: flask
      label: Laboratory freezers
    - icon: snow
      label: Cascade low stage
    - icon: factory
      label: Environmental test chambers
