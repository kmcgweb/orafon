en:
  summary: A single-component HCFC that is liquid at room temperature, used for flushing refrigeration piping before recharging and as a foam blowing agent. Flammable (A2) and being phased out under the Montreal Protocol.
  applications:
    - icon: wrench
      label: System flushing
    - icon: foam
      label: Foam blowing
