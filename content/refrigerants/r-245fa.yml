en:
  summary: A low-pressure, single-component HFC that is non-flammable but in the higher-toxicity group (B1). Used in low-pressure chillers, Organic Rankine Cycle (ORC) systems and as a foam blowing agent; handle strictly according to safety requirements.
  applications:
    - icon: chiller
      label: Low-pressure chillers
    - icon: bolt
      label: ORC power generation
    - icon: foam
      label: Foam blowing
