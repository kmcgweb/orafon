    - icon: snow
      label: ห้องเย็น
en:
  summary: A single-component, non-flammable (A1) HCFC that was the mainstay of older air conditioners and cold rooms. Because it depletes ozone it is being phased out under the Montreal Protocol and is now mainly used to service existing systems.
  applications:
    - icon: home
      label: Legacy residential AC
    - icon: ac
      label: Legacy commercial AC
    - icon: snow
      label: Cold rooms
