th:
  id: r-22
  number: R-22
  class: HCFC
  composition: CHClF₂ (Chlorodifluoromethane)
  blend_type: pure
  safety: A1
  gwp_ar4: "1810"
  gwp_ar5: "1760"
  odp: "0.055"
  boiling_point: −40.8
  replaces: []
  color: "#0F766E"
  color2: "#0D9488"
  order: 5
  summary: สาร HCFC ชนิดเดี่ยว ไม่ติดไฟ (A1) เคยเป็นสารหลักของเครื่องปรับอากาศและห้องเย็นรุ่นเก่า มีค่า ODP จึงอยู่ระหว่างการทยอยเลิกใช้ตามพิธีสารมอนทรีออล ปัจจุบันใช้สำหรับงานซ่อมบำรุงระบบเดิมเป็นหลัก
  applications:
    - icon: home
