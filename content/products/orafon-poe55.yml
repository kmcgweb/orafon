  name: ORAFON POE 55
  tagline: POE compressor oil for HFC/HFO systems
  tag: ''
  specs:
  - k: Viscosity at 40 °C
    v: '53.9 cSt'
  - k: Viscosity at 100 °C
    v: '8.2 cSt'
  - k: Viscosity index (VI)
