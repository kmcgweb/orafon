  short: ORAFON POE 55 is a POE (polyol ester) compressor oil for air-conditioning and refrigeration compressors running HFC and HFO refrigerants, viscosity grade 55.
  highlights:
  - title: POE type
    text: Polyol Ester
  - title: Grade 55
    text: Choose the viscosity grade specified by the compressor maker
  - title: Ask our team
    text: 1 L, 5 L and 18.9 L packs; contact ORAFON for technical documents
  description: |-
    ORAFON POE 55 is a POE (polyol ester) compressor oil for air-conditioning and refrigeration compressors running HFC and HFO refrigerants, viscosity grade 55.

    Always use the oil type and grade specified by the compressor manufacturer. Available in 1 L, 5 L and 18.9 L. Contact the ORAFON team for stock, technical data and a quotation.
