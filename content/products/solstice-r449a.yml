en:
  name: Solstice® R-449A
  tagline: HFO Blend refrigerant
  tag: Low GWP
  badges:
    - 64% lower GWP vs R-404A
    - A1 non-flammable
    - ODP = 0
  short: Solstice® R-449A is a non-flammable (A1) HFO/HFC blend replacing R-404A, R-507A and R-22 in low- and medium-temperature commercial refrigeration, with about 64% lower GWP than R-404A; for new systems and retrofits.
  highlights:
    - title: 64% lower GWP
      text: GWP (AR4) 1397, about 64% below R-404A · ODP 0
    - title: HFO Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-125 / R-1234yf / R-134a (24.3/24.7/25.3/25.7)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-404A, R-507A, R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Supermarkets · Cold rooms · Display cases
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-449A is an HFO Blend refrigerant (zeotropic blend), ASHRAE number R-449A, composition R-32 / R-125 / R-1234yf / R-134a (24.3/24.7/25.3/25.7). It is classified A1 under ASHRAE 34, with GWP (AR4) 1397 and ODP 0.

    A non-flammable (A1) HFO/HFC blend replacing R-404A, R-507A and R-22 in low- and medium-temperature commercial refrigeration, with about 64% lower GWP than R-404A; for new systems and retrofits.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-449A replace?
      a: R-404A, R-507A, R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-449A R-449A HFO Blend refrigerant, A1, GWP 1397. Distributed by ORAFON — request a quotation.
