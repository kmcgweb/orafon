  description: |-
    Solstice® R-449A เป็นสารทำความเย็นประเภท HFO Blend แบบ Zeotropic หมายเลข ASHRAE R-449A ส่วนผสม R-32 / R-125 / R-1234yf / R-134a (24.3/24.7/25.3/25.7) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 1397 และ ODP 0

    สาร HFO/HFC ผสม ไม่ติดไฟ (A1) ทดแทน R-404A, R-507A และ R-22 ในงานทำความเย็นเชิงพาณิชย์อุณหภูมิต่ำถึงปานกลาง ค่า GWP ต่ำกว่า R-404A ราว 64% ใช้ได้ทั้งงานใหม่และงาน Retrofit

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-449A ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A, R-507A, R-22 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
