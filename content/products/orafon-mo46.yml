  - title: ไม่ใช้กับสาร HFC
    text: ระบบ R-32, R-410A, R-134a, R-404A ให้ใช้น้ำมัน POE แทน
  description: |-
    ORAFON MO 46 เป็นน้ำมันคอมเพรสเซอร์ชนิด Mineral Oil เกรดความหนืด ISO VG 46 สำหรับคอมเพรสเซอร์ที่ใช้สารทำความเย็น HCFC เช่น R-22 ในเครื่องปรับอากาศ ห้องเย็น และตู้แช่ ไม่เหมาะกับระบบที่ใช้สาร HFC เช่น R-32, R-410A, R-134a และ R-404A ซึ่งควรใช้น้ำมัน POE

    ควรเลือกชนิดและเกรดน้ำมันให้ตรงกับที่ผู้ผลิตคอมเพรสเซอร์กำหนด มีขนาดบรรจุ 200 ลิตร และ 18.9 ลิตร ติดต่อทีม ORAFON เพื่อสอบถามสต็อก ข้อมูลทางเทคนิค และขอใบเสนอราคา
