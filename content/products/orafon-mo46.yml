  short: ORAFON MO 46 — น้ำมันคอมเพรสเซอร์ชนิด Mineral Oil เกรดความหนืด 46 สำหรับคอมเพรสเซอร์ที่ใช้สารทำความเย็น HCFC เช่น R-22 ในเครื่องปรับอากาศ ห้องเย็น และตู้แช่
  highlights:
  - title: Mineral Oil
    text: น้ำมันแร่สำหรับคอมเพรสเซอร์ เกรดความหนืด ISO VG 46
  - title: ใช้กับ R-22 และสาร HCFC
