en:
  name: ORAFON MO 46
  tagline: Mineral compressor oil for R-22 and refrigeration
  tag: ''
  specs:
  - k: Viscosity at 40 °C
    v: '46 cSt'
  - k: Viscosity at 100 °C
    v: '5.4 cSt'
  - k: Viscosity index (VI)
    v: '94'
  - k: Pour point
    v: '-36 °C'
  - k: Flash point
    v: '194 °C'
  - k: Density at 15 °C
    v: '0.91 g/cm³'
  - k: Moisture
    v: '16 ppm'
  - k: Total acid number (TAN)
    v: '0.02 mgKOH/g'
  short: ORAFON MO 46 is a mineral compressor oil, viscosity grade 46, for compressors running HCFC refrigerants such as R-22 in air-conditioners, cold rooms and display cabinets.
  highlights:
  - title: Mineral oil
    text: Mineral compressor oil, ISO VG 46
  - title: For R-22 and HCFCs
    text: For systems running R-22 and other HCFC refrigerants
  - title: Not for HFCs
    text: For R-32, R-410A, R-134a and R-404A systems, use POE oil
  description: |-
    ORAFON MO 46 is a mineral compressor oil, ISO VG 46, for compressors running HCFC refrigerants such as R-22 in air-conditioners, cold rooms and display cabinets. It is not suitable for HFC systems such as R-32, R-410A, R-134a and R-404A, which need POE oil.

    Always use the oil type and grade specified by the compressor manufacturer. Available in 200 L and 18.9 L. Contact the ORAFON team for stock, technical data and a quotation.
  applications:
  - icon: ac
    label: R-22 air-conditioners
  - icon: snow
    label: Cold rooms and display cabinets
  seo_description: ORAFON MO 46 mineral compressor oil for R-22, cold rooms and refrigeration, 200 L and 18.9 L, from ORAFON.
