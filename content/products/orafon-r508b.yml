en:
  name: ORAFON R-508B
  tagline: Ultra-low-temperature HFC blend
  tag: ""
  badges:
    - GWP 13396
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-508B is an azeotropic, non-flammable (A1) HFC blend for ultra-low temperatures down to −80 °C and below — medical and laboratory freezers — used in the low stage of cascade systems. Very high GWP.
  highlights:
    - title: GWP 13396
      text: GWP (AR4) 13396 · ODP 0
    - title: HFC Blend
      text: Azeotropic blend · R-23 / R-116 (46/54)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-503, R-13
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Medical & lab ULT freezers · Cascade low stage · Test chambers
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-508B is an HFC Blend refrigerant (azeotropic blend), ASHRAE number R-508B, composition R-23 / R-116 (46/54). It is classified A1 under ASHRAE 34, with GWP (AR4) 13396 and ODP 0.

    An azeotropic, non-flammable (A1) HFC blend for ultra-low temperatures down to −80 °C and below — medical and laboratory freezers — used in the low stage of cascade systems. Very high GWP.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-508B replace?
      a: R-503, R-13. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-508B R-508B HFC Blend refrigerant, A1, GWP 13396. Distributed by ORAFON — request a quotation.
