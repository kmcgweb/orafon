  description: |-
    ORAFON R-508B เป็นสารทำความเย็นประเภท HFC Blend แบบสารผสมอะซีโอโทรป หมายเลข ASHRAE R-508B ส่วนผสม R-23 / R-116 (46/54) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 13396 และ ODP 0

    สาร HFC ผสมแบบอะซีโอโทรป ไม่ติดไฟ (A1) สำหรับงานอุณหภูมิต่ำพิเศษถึง −80 °C หรือต่ำกว่า เช่น ตู้แช่แข็งทางการแพทย์และห้องแล็บ ใช้ในภาคอุณหภูมิต่ำของระบบคาสเคด มีค่า GWP สูงมาก

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-508B ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-503, R-13 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
