  short: ORAFON R-508B — สาร HFC ผสมแบบอะซีโอโทรป ไม่ติดไฟ (A1) สำหรับงานอุณหภูมิต่ำพิเศษถึง −80 °C หรือต่ำกว่า เช่น ตู้แช่แข็งทางการแพทย์และห้องแล็บ ใช้ในภาคอุณหภูมิต่ำของระบบคาสเคด มีค่า GWP สูงมาก
