en:
  name: Solstice® R-454C
  tagline: HFO Blend refrigerant
  tag: Ultra-low GWP
  badges:
    - 96% lower GWP vs R-404A
    - A2L mildly flammable
    - ODP = 0
  short: Solstice® R-454C is an HFO/HFC blend with very low GWP (below 150) for new commercial refrigeration and heat pumps designed for A2L refrigerants, replacing R-404A in new installations.
  highlights:
    - title: 96% lower GWP
      text: GWP (AR4) 148, about 96% below R-404A · ODP 0
    - title: HFO Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-1234yf (21.5/78.5)
    - title: A2L mildly flammable
      text: Mildly flammable — use only in equipment designed for A2L
    - title: Replaces R-404A
      text: In new equipment designed for A2L (not a drop-in)
    - title: Applications
      text: Commercial cabinets · Condensing units · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-454C is an HFO Blend refrigerant (zeotropic blend), ASHRAE number R-454C, composition R-32 / R-1234yf (21.5/78.5). It is classified A2L under ASHRAE 34, with GWP (AR4) 148 and ODP 0.

    An HFO/HFC blend with very low GWP (below 150) for new commercial refrigeration and heat pumps designed for A2L refrigerants, replacing R-404A in new installations.

    **Caution:** R-454C is classified A2L (mildly flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-454C replace?
      a: R-404A, in equipment designed for A2L refrigerants. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2L under ASHRAE 34. Mildly flammable: use only in equipment designed for A2L."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-454C R-454C HFO Blend refrigerant, A2L, GWP 148. Distributed by ORAFON — request a quotation.
