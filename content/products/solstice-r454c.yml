  description: |-
    Solstice® R-454C เป็นสารทำความเย็นประเภท HFO Blend แบบสารผสมซีโอโทรป หมายเลข ASHRAE R-454C ส่วนผสม R-32 / R-1234yf (21.5/78.5) จัดอยู่ในกลุ่มความปลอดภัย A2L ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 148 และ ODP 0

    สาร HFO/HFC ผสม ค่า GWP ต่ำมาก (ต่ำกว่า 150) สำหรับระบบทำความเย็นเชิงพาณิชย์และฮีตปั๊มรุ่นใหม่ที่ออกแบบสำหรับสารกลุ่ม A2L ใช้แทน R-404A ในงานติดตั้งใหม่

    **ข้อควรระวัง:** R-454C จัดอยู่ในกลุ่ม A2L (ติดไฟได้เล็กน้อย) ต้องใช้กับอุปกรณ์ที่ออกแบบมาสำหรับสารกลุ่มนี้เท่านั้น ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1 และควรให้ช่างที่ผ่านการอบรมเป็นผู้ดำเนินการ

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-454C ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A ในอุปกรณ์ที่ออกแบบสำหรับสารกลุ่ม A2L ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A2L ตามมาตรฐาน ASHRAE 34 ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
