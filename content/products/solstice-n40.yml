en:
  name: Solstice® N40 (R-448A)
  tagline: HFO blend refrigerant
  tag: ''
  specs: []
  badges:
    - 68% lower GWP vs R-404A
    - A1 non-flammable
    - ODP = 0
  short: Solstice® N40 (R-448A) is a non-flammable HFO blend designed to replace R-404A, R-507, R-22 and R-407 series in commercial refrigeration — for new systems and retrofits — offering lower GWP and energy savings in qualifying systems.
  highlights:
    - title: 68% lower GWP
      text: Compared with R-404A; supports the move away from older HFCs/HCFCs
    - title: Energy savings
      text: Reduced energy use in qualifying systems
    - title: A1 non-flammable
      text: Familiar handling practices for technicians
    - title: New build / retrofit
      text: Suitable for new systems and R-404A conversions
    - title: Low–medium temperature
      text: Food retail, cold rooms, display cases, DX systems
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® N40 (R-448A) is a non-flammable HFO blend developed as an alternative to R-404A, R-507, R-22 and the R-407 series, including interim blends, in commercial refrigeration. It suits contractors, distributors, service teams and building operators for both new installations and retrofits of low- and medium-temperature systems.

    With an A1 non-flammable classification it supports familiar handling practices, while its performance profile supports reliable operation across cold storage and food retail.

    Compared with R-404A, Solstice N40 offers 68% lower GWP and can reduce energy use in qualifying systems — a strong efficiency and operating-cost case for teams planning long-term refrigerant strategy.
