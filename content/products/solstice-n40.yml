    - icon: store
      icon_image: ''
      label: Supermarkets
    - icon: box
      icon_image: ''
      label: Cold storage warehouses
    - icon: snow
      icon_image: ''
      label: Self-contained condensing units
  faq:
    - q: Which refrigerants can Solstice N40 replace?
      a: R-404A, R-507, R-22 and the R-407 series, including interim blends, in commercial refrigeration — for both new systems and retrofits.
    - q: Is it flammable? How safe is it?
      a: It is classified A1 (non-flammable) under ASHRAE, so technicians and service teams can use familiar handling practices.
    - q: Does it really lower GWP and save energy?
      a: Compared with R-404A it has 68% lower GWP and can reduce energy consumption in qualifying systems, lowering long-term operating costs.
    - q: Which pack sizes are available?
      a: Four sizes — Jug 11.3 kg, Cylinder 45 kg, Half Ton 386 kg and Ton 658 kg. Contact ORAFON to check stock and request a quotation.
  seo_description: Solstice® N40 (R-448A) non-flammable A1 HFO blend refrigerant replacing R-404A with 68% lower GWP. Distributed by ORAFON — request a quotation.
