  faq:
    - q: Solstice N40 ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A, R-507, R-22 และ R-407 series รวมถึง interim blends ในงานทำความเย็นเชิงพาณิชย์ รองรับทั้งงานติดตั้งใหม่และงาน Retrofit
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 (nonflammable) ตามมาตรฐาน ASHRAE คือไม่ติดไฟ รองรับแนวทางการจัดการที่ช่างและทีมบริการคุ้นเคยอยู่แล้ว
    - q: ช่วยลด GWP และประหยัดพลังงานได้จริงไหม?
      a: เทียบกับ R-404A ให้ค่า GWP ต่ำลง 68% และช่วยลดการใช้พลังงานในระบบที่เข้าเงื่อนไข ช่วยลดต้นทุนการดำเนินงานระยะยาว
    - q: มีขนาดบรรจุอะไรบ้าง?
      a: มี 4 ขนาด ได้แก่ Jug 11.3 kg, Cylinder 45 kg, Half Ton 386 kg และ Ton 658 kg ติดต่อ ORAFON เพื่อตรวจสอบสต็อกและขอใบเสนอราคา
