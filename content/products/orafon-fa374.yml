  short: ORAFON FA-374 — น้ำยาทำความสะอาดชนิดพิเศษสำหรับงานอุตสาหกรรม ละลายคราบได้ดีมาก (KB 70) ไม่ติดไฟ ไม่ทำลายโอโซน และค่า GWP ต่ำ เหมาะกับงาน Vapor Degreasing และใช้ทดแทน TCE, nPB และ HCFC-141b
  highlights:
  - title: ละลายคราบได้ดีเยี่ยม
    text: ค่า KB 70 สูงกว่า HCFC-141b (56) และ HCFC-225 (31) ล้างคราบน้ำมันและไขมันได้หมดจด
  - title: แห้งเร็ว
    text: จุดเดือด 39 °C ชิ้นงานแห้งเร็ว นำไปใช้งานต่อได้ทันที
  - title: ไม่ติดไฟ
    text: ไม่มีจุดวาบไฟ กลิ่นน้อย ความเป็นพิษต่ำ
  - title: เป็นมิตรต่อสิ่งแวดล้อม
    text: ODP 0 ไม่ใช่สารทำลายโอโซน และค่า GWP ต่ำ
  - title: ดูแลง่าย
    text: ส่วนผสมคงที่ (Azeotropic-like) ไม่ต้องเติมสารเพิ่มเสถียรภาพ ไม่ต้องใช้สารลดแรงตึงผิว ไม่ทิ้งคราบ
  - title: ใช้กับเครื่องเดิมได้
    text: ใช้กับเครื่อง Vapor Degreasing เดิมได้ โดยแทบไม่ต้องดัดแปลง นำกลับมาใช้ซ้ำได้ ช่วยลดต้นทุน
  description: |-
    ORAFON FA-374 เป็นน้ำยาทำความสะอาดชนิดพิเศษ พัฒนาขึ้นสำหรับงานทำความสะอาดในอุตสาหกรรมที่ต้องการน้ำยาที่ละลายคราบได้สูง มีความปลอดภัย ไม่ติดไฟ เป็นมิตรต่อสิ่งแวดล้อม และมีค่า GWP ต่ำ จึงได้รับความนิยมสูงในงานล้างคราบไขมันด้วยไอระเหย (Vapor Degreasing)

    FA-374 เป็นส่วนผสมแบบ Near-azeotropic ละลายคราบได้ดีเยี่ยม แรงตึงผิวต่ำ จึงแทรกซึมล้างคราบไขมันได้ลึกและมีประสิทธิภาพ ใช้งานง่าย เชื่อถือได้ และแทบไม่ต้องบำรุงรักษา

    **ใช้ทดแทนได้**

    - ตัวทำละลายที่ละลายคราบสูง เช่น Trichloroethylene (TCE), n-Propyl Bromide (nPB), Aromatic Hydrocarbons, Perchloroethylene และ Dichloromethane
    - ตัวทำละลายที่ละลายคราบต่ำถึงปานกลาง เช่น HCFC-225, HCFC-141b, PFC, CFC และน้ำยาล้างสูตรน้ำ

    **เทียบคุณสมบัติ**

    | คุณสมบัติ | FA-374 | HCFC-141b | HCFC-225 | nPB |
    |---|---|---|---|---|
    | จุดเดือด (°C) | 39 | 32 | 54 | 71 |
    | ค่า KB | 70 | 56 | 31 | 125 |
    | จุดวาบไฟ (°C) | ไม่มี | ไม่มี | ไม่มี | 25 |
    | ODP | 0 | 0.1 | 0.03 | 0.02 |
    | GWP | ต่ำ | 630 | 370 | – |

    **วัสดุที่ใช้ร่วมได้**

    - โลหะ: เหล็กหล่อ, เหล็กกล้าคาร์บอน, เหล็ก, ทองเหลือง, ทองแดง, สแตนเลส, อะลูมิเนียม และอะลูมิเนียมอัลลอย
    - พลาสติก: PTFE, PVC, Nylon 6, Phenolic resin, Epoxy resin, Polyethylene, Polypropylene
    - ยางและอีลาสโตเมอร์: ยางธรรมชาติ, Fluoro rubber

    **การจัดเก็บ:** เก็บในคลังสินค้าที่สะอาด แห้ง และไม่ร้อน ห่างจากแสง ความร้อน แหล่งความร้อน กรด ด่างแก่ และสารออกซิไดซ์ ห้ามเก็บรวมกับสารที่เป็นกรดหรือด่าง หลีกเลี่ยงการเขย่าแรงระหว่างขนส่ง และห้ามวางกลับหัวเมื่อซ้อนกัน

    **ข้อควรระวัง:** ผู้ใช้งานต้องมีประสบการณ์และสวมอุปกรณ์ป้องกันส่วนบุคคล (PPE) อาจทำให้ระคายเคืองตาอย่างรุนแรง (H320) อาจทำให้ง่วงซึมหรือเวียนศีรษะ (H336) เป็นอันตรายต่อสิ่งมีชีวิตในน้ำและมีผลระยะยาว (H412) หลีกเลี่ยงการสูดดมไอระเหย (P261)
  applications:
  - icon: factory
    label: ล้างคราบไขมันด้วยไอระเหย (Vapor Degreasing)
  - icon: flask
