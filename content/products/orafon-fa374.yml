    file: /assets/uploads/docs/orafon-fa374-tds.pdf
  faq:
  - q: ORAFON FA-374 ใช้ทำอะไร?
    a: ใช้ทำความสะอาดชิ้นงานในอุตสาหกรรม เช่น ล้างคราบน้ำมันและไขมัน ล้าง Flux และ Solder paste บนแผงวงจร ล้างคราบซิลิโคน ล้างน้ำมันกลึงในงานโลหะความแม่นยำสูง และทำความสะอาดกระจกออปติคอล ทั้งแบบ Vapor Degreasing และแบบล้างเย็น (Cold cleaning)
  - q: ใช้แทน HCFC-141b ได้ไหม?
    a: ได้ FA-374 ละลายคราบได้ดีกว่า (KB 70 เทียบกับ 56) ไม่ทำลายโอโซน (ODP 0) และค่า GWP ต่ำ จึงเป็นทางเลือกแทน HCFC-141b ที่อยู่ระหว่างทยอยเลิกใช้
  - q: ติดไฟหรือไม่?
    a: ไม่มีจุดวาบไฟ (Flash point) และมีคุณสมบัติหน่วงการติดไฟ แต่ควรใช้งานในที่อากาศถ่ายเท สวมอุปกรณ์ป้องกัน และหลีกเลี่ยงการสูดดมไอระเหย
  - q: มีขนาดบรรจุอะไรบ้าง?
    a: ถังขนาด 30 กก. และ 250 กก. ติดต่อทีม ORAFON เพื่อสอบถามสต็อกและขอใบเสนอราคา
  seo_description: ORAFON FA-374 น้ำยาทำความสะอาดชิ้นงานอุตสาหกรรม ไม่ติดไฟ KB 70 ODP 0 GWP ต่ำ ใช้แทน TCE, nPB, HCFC-141b สำหรับ Vapor Degreasing ถัง 30 และ 250 กก.
