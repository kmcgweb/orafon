en:
  name: ORAFON FA-374
  tagline: Non-flammable industrial cleaning fluid
  seo_keyword: Vapor degreasing solvent
  short: ORAFON FA-374 is a specialty industrial cleaning fluid with very high solvency (KB 70). It is non-flammable, non-ozone-depleting and low-GWP, ideal for vapor degreasing and as a replacement for TCE, nPB and HCFC-141b.
  specs:
  - k: Appearance
    v: Clear, colourless liquid (near-azeotropic mixture)
  - k: Boiling point
    v: 39 °C
  - k: Density @ 25 °C
    v: 1.27 g/ml
  - k: Surface tension
    v: 20 mN/m
  - k: Vapor pressure
    v: 50 kPa
  - k: KB value (Kauri-butanol)
    v: '70'
  - k: Flash point
    v: None
  - k: ODP
    v: '0'
  - k: GWP
    v: Low
  highlights:
  - title: Outstanding solvency
    text: KB value 70, higher than HCFC-141b (56) and HCFC-225 (31), for thorough removal of oils and grease
  - title: Fast drying
    text: 39 °C boiling point, so cleaned parts are ready to use right away
  - title: Non-flammable
    text: No flash point, low odour and low toxicity
  - title: Environmentally sound
    text: ODP 0, not an ozone-depleting substance, and low GWP
  - title: Low maintenance
    text: Stable azeotropic-like blend, no stabiliser top-ups, no surfactants needed, residue-free
  - title: Works in existing equipment
    text: Runs in most existing vapor degreasers with little or no modification, and can be recovered and reused to cut costs
  description: |-
    ORAFON FA-374 is a specialty cleaning fluid designed for industrial cleaning that demands high solvency. It is safe, non-flammable, environmentally friendly and low-GWP, which makes it popular for vapor degreasing.

    FA-374 is a near-azeotropic mixture with excellent solvency and low surface tension, so it penetrates and removes grease deeply and efficiently. It is easy to use, highly reliable and needs minimal maintenance.

    **Replaces**

    - High-solvency solvents such as trichloroethylene (TCE), n-propyl bromide (nPB), aromatic hydrocarbons, perchloroethylene and dichloromethane
    - Low- to medium-solvency solvents such as HCFC-225, HCFC-141b, PFC, CFC and water-based cleaners

    **Property comparison**

    | Property | FA-374 | HCFC-141b | HCFC-225 | nPB |
    |---|---|---|---|---|
    | Boiling point (°C) | 39 | 32 | 54 | 71 |
    | KB value | 70 | 56 | 31 | 125 |
    | Flash point (°C) | None | None | None | 25 |
    | ODP | 0 | 0.1 | 0.03 | 0.02 |
    | GWP | Low | 630 | 370 | – |

    **Material compatibility**

    - Metals: cast iron, carbon steel, steel, brass, copper, stainless steel, aluminium and aluminium alloys
    - Plastics: PTFE, PVC, nylon 6, phenolic resin, epoxy resin, polyethylene, polypropylene
    - Rubber and elastomers: natural rubber, fluoro rubber

    **Storage:** Keep in a clean, dry warehouse away from high temperatures, light, heat sources, acids, strong bases and oxidants. Do not store with acidic or alkaline substances. Avoid severe shaking in transport and do not stack upside down.

    **Caution:** Must be used by experienced operators wearing personal protective equipment. May cause serious eye irritation (H320) and drowsiness or dizziness (H336); harmful to aquatic life with long-lasting effects (H412). Avoid breathing vapour (P261).
  applications:
  - icon: factory
    label: Vapor degreasing
  - icon: flask
    label: Precision and PCB cleaning
  faq:
  - q: What is ORAFON FA-374 used for?
    a: Industrial parts cleaning, such as removing oils and grease, flux and solder paste on circuit boards, silicone, machining oils in precision metalwork, and cleaning optical glass, in both vapor degreasing and cold cleaning.
  - q: Can it replace HCFC-141b?
    a: Yes. FA-374 has higher solvency (KB 70 vs 56), zero ODP and low GWP, making it an alternative to HCFC-141b, which is being phased out.
  - q: Is it flammable?
    a: It has no flash point and is flame retardant, but use it with good ventilation, wear protective equipment and avoid breathing the vapour.
  - q: Which pack sizes are available?
    a: 30 kg and 250 kg drums. Contact the ORAFON team for stock and a quotation.
  seo_description: ORAFON FA-374 non-flammable industrial cleaning fluid, KB 70, ODP 0, low GWP. Replaces TCE, nPB and HCFC-141b in vapor degreasing. 30 and 250 kg drums.
