  description: |-
    ORAFON R-404A เป็นสารทำความเย็นประเภท HFC Blend แบบสารผสมเกือบอะซีโอโทรป หมายเลข ASHRAE R-404A ส่วนผสม R-125 / R-143a / R-134a (44/52/4) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 3922 และ ODP 0

    สาร HFC ผสม ไม่ติดไฟ (A1) สำหรับงานทำความเย็นอุณหภูมิต่ำถึงปานกลาง มีค่า GWP สูง หลายประเทศจึงกำลังทยอยเปลี่ยนไปใช้สารทดแทน GWP ต่ำ เช่น R-448A

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-404A ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-502, R-22 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
