en:
  name: ORAFON R-404A
  tagline: HFC Blend refrigerant
  tag: ""
  badges:
    - GWP 3922
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-404A is a non-flammable (A1) HFC blend for low- and medium-temperature refrigeration. Its high GWP means many markets are moving to low-GWP alternatives such as R-448A.
  highlights:
    - title: GWP 3922
      text: GWP (AR4) 3922 · ODP 0
    - title: HFC Blend
      text: Near-azeotropic blend · R-125 / R-143a / R-134a (44/52/4)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-502, R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Cold rooms / freezing · Supermarkets · Transport refrigeration
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-404A is an HFC Blend refrigerant (near-azeotropic blend), ASHRAE number R-404A, composition R-125 / R-143a / R-134a (44/52/4). It is classified A1 under ASHRAE 34, with GWP (AR4) 3922 and ODP 0.

    A non-flammable (A1) HFC blend for low- and medium-temperature refrigeration. Its high GWP means many markets are moving to low-GWP alternatives such as R-448A.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-404A replace?
      a: R-502, R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-404A R-404A HFC Blend refrigerant, A1, GWP 3922. Distributed by ORAFON — request a quotation.
