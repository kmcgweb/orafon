    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    ORAFON R-245fa เป็นสารทำความเย็นประเภท HFC แบบสารเดี่ยว หมายเลข ASHRAE R-245fa ส่วนผสม CF₃CH₂CHF₂ (1,1,1,3,3-Pentafluoropropane) จัดอยู่ในกลุ่มความปลอดภัย B1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 1030 และ ODP 0

    สาร HFC แรงดันต่ำ ชนิดเดี่ยว ไม่ติดไฟ แต่จัดอยู่ในกลุ่มความเป็นพิษสูงกว่า (B1) ใช้ในชิลเลอร์แรงดันต่ำ ระบบ Organic Rankine Cycle (ORC) และเป็นสารเป่าโฟม ต้องจัดการตามข้อกำหนดความปลอดภัยอย่างเคร่งครัด

    **ข้อควรระวัง:** สารกลุ่ม B1 มีความเป็นพิษสูงกว่า ต้องติดตั้งระบบระบายอากาศและตรวจจับการรั่วไหล และใช้อุปกรณ์ป้องกันตามเอกสาร SDS

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-245fa ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-11, R-123 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม B1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ แต่ความเป็นพิษสูงกว่า ต้องมีการระบายอากาศ ตรวจจับการรั่ว และอุปกรณ์ป้องกัน
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
