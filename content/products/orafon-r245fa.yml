en:
  name: ORAFON R-245fa
  tagline: Low-pressure HFC
  tag: ""
  badges:
    - GWP 1030
    - B1 non-flammable (higher toxicity)
    - ODP = 0
  short: ORAFON R-245fa is a low-pressure, single-component HFC that is non-flammable but in the higher-toxicity group (B1). Used in low-pressure chillers, Organic Rankine Cycle (ORC) systems and as a foam blowing agent; handle strictly according to safety requirements.
  highlights:
    - title: GWP 1030
      text: GWP (AR4) 1030 · ODP 0
    - title: HFC
      text: Single component · CF₃CH₂CHF₂ (1,1,1,3,3-Pentafluoropropane)
    - title: B1 non-flammable (higher toxicity)
      text: Non-flammable but higher toxicity — needs ventilation, leak detection and PPE
    - title: Replaces R-11, R-123
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Low-pressure chillers · ORC power generation · Foam blowing
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-245fa is an HFC refrigerant (single component), ASHRAE number R-245fa, composition CF₃CH₂CHF₂ (1,1,1,3,3-Pentafluoropropane). It is classified B1 under ASHRAE 34, with GWP (AR4) 1030 and ODP 0.

    A low-pressure, single-component HFC that is non-flammable but in the higher-toxicity group (B1). Used in low-pressure chillers, Organic Rankine Cycle (ORC) systems and as a foam blowing agent; handle strictly according to safety requirements.

    **Caution:** B1 refrigerants have higher toxicity. Install ventilation and leak detection, and use protective equipment as specified in the SDS.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-245fa replace?
      a: R-11, R-123. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified B1 under ASHRAE 34. Non-flammable but higher toxicity: needs ventilation, leak detection and PPE."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-245fa R-245fa HFC refrigerant, B1, GWP 1030. Distributed by ORAFON — request a quotation.
