  description: |-
    Solstice® R-513A เป็นสารทำความเย็นประเภท HFO Blend แบบ Azeotropic หมายเลข ASHRAE R-513A ส่วนผสม R-1234yf / R-134a (56/44) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 631 และ ODP 0

    สาร HFO/HFC ผสมแบบ Azeotropic ไม่ติดไฟ (A1) คุณสมบัติใกล้เคียง R-134a แต่ค่า GWP ต่ำกว่ามาก เหมาะกับชิลเลอร์และงานทำความเย็นอุณหภูมิปานกลาง

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-513A ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-134a ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
  seo_description: Solstice® R-513A สารทำความเย็น R-513A HFO Blend A1 GWP 631 จัดจำหน่ายโดย ORAFON ขอใบเสนอราคาได้
en:
  name: Solstice® R-513A
  tagline: HFO Blend refrigerant
  tag: Low GWP
  badges:
    - 56% lower GWP vs R-134a
    - A1 non-flammable
    - ODP = 0
  short: Solstice® R-513A is an azeotropic, non-flammable (A1) HFO/HFC blend with properties close to R-134a but a much lower GWP — suited to chillers and medium-temperature refrigeration.
  highlights:
    - title: 56% lower GWP
      text: GWP (AR4) 631, about 56% below R-134a · ODP 0
    - title: HFO Blend
      text: Azeotropic blend · R-1234yf / R-134a (56/44)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-134a
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Chillers · Medium-temperature refrigeration · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-513A is an HFO Blend refrigerant (azeotropic blend), ASHRAE number R-513A, composition R-1234yf / R-134a (56/44). It is classified A1 under ASHRAE 34, with GWP (AR4) 631 and ODP 0.

    An azeotropic, non-flammable (A1) HFO/HFC blend with properties close to R-134a but a much lower GWP — suited to chillers and medium-temperature refrigeration.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-513A replace?
      a: R-134a. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-513A R-513A HFO Blend refrigerant, A1, GWP 631. Distributed by ORAFON — request a quotation.
