en:
  name: ORAFON UV CHECK
  tagline: UV leak-detection dye for automotive A/C
  tag: ''
  specs:
  - k: Volume per tube
    v: 7.5 ml
  - k: Formula
    v: Fluorescent dye
  - k: In the kit
    v: Adapter (low-pressure port), flexible hose, 6 stickers
  short: ORAFON UV CHECK is a fluorescent leak-detection dye for automotive air-conditioning that makes finding leaks easy on vehicles of every make.
  highlights:
  - title: Easy leak finding
    text: Fluorescent dye shows leaks clearly under UV light
  - title: Fits all makes
    text: For automotive A/C systems of every make
  - title: Complete kit
    text: Low-pressure port adapter, flexible hose and 6 stickers
  description: |-
    ORAFON UV CHECK is a leak-detection dye for automotive air-conditioning. Its fluorescent formula makes it easy to find leaks in the A/C systems of vehicles of every make.

    **In the kit**

    - Adapter for the low-pressure port
    - Flexible hose connecting the adapter to the dye tube
    - 6 stickers to mark vehicles whose system has been dyed for leak checking
  applications:
  - icon: car
    label: Automotive A/C
  - icon: wrench
    label: Leak detection
  seo_description: ORAFON UV CHECK fluorescent leak-detection dye for automotive A/C, 7.5 ml tubes, pack of 6, with adapter and flexible hose.
