  - k: ส่วนผสม
    v: สารฟลูออเรสเซนต์ (Fluorescent)
  - k: อุปกรณ์ในชุด
    v: Adapter (Low Pressure Port), Flexible Hose, สติกเกอร์ 6 ชิ้น
  short: ORAFON UV CHECK — สีตรวจสอบรอยรั่วระบบแอร์รถยนต์ ผสมสารฟลูออเรสเซนต์ ช่วยหารอยรั่วในระบบปรับอากาศรถยนต์ทุกสัญชาติได้ง่าย
  highlights:
  - title: หารอยรั่วง่าย
    text: ส่วนผสมฟลูออเรสเซนต์ มองเห็นจุดรั่วชัดเมื่อส่องด้วยไฟ UV
  - title: ใช้ได้ทุกรุ่น
    text: ใช้กับระบบปรับอากาศรถยนต์ทุกสัญชาติ
  - title: ครบในชุด
    text: มี Adapter ต่อ Port Low Pressure, สาย Flexible Hose และสติกเกอร์ 6 ชิ้น
  description: |-
    ORAFON UV CHECK ผลิตภัณฑ์สีตรวจสอบรอยรั่วระบบแอร์รถยนต์ โดดเด่นด้วยส่วนผสมของสารฟลูออเรสเซนต์ (Fluorescent) ช่วยให้การตรวจหารอยรั่วในระบบปรับอากาศรถยนต์ทุกสัญชาติเป็นเรื่องง่าย

    **อุปกรณ์ในชุด**

    - Adapter สำหรับต่อ Port Low Pressure
    - สาย Flexible Hose สำหรับเชื่อมต่อ Adapter กับหลอดสี
    - สติกเกอร์ 6 ชิ้น สำหรับติดแสดงว่ารถได้ตรวจสอบรอยรั่วด้วยการฉีดสีเข้าไปในระบบแล้ว
