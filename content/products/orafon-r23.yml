  short: ORAFON R-23 — สาร HFC ชนิดเดี่ยว ไม่ติดไฟ (A1) จุดเดือดต่ำมาก ใช้ในระบบทำความเย็นอุณหภูมิต่ำพิเศษ เช่น ภาคอุณหภูมิต่ำของระบบคาสเคด ตู้แช่แข็งห้องแล็บ และห้องทดสอบ มีค่า GWP สูงมาก
