    - title: GWP 14800
      text: ค่า GWP (AR4) 14800 · ODP 0
    - title: HFC
      text: สารเดี่ยว · CHF₃ (Trifluoromethane)
    - title: A1 ไม่ติดไฟ
      text: ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - title: ใช้ทดแทน R-13
      text: ทั้งงานติดตั้งใหม่และงานเปลี่ยนสาร (ตรวจสอบกับผู้ผลิตอุปกรณ์)
    - title: งานที่เหมาะ
      text: ตู้แช่แข็งห้องแล็บ · ระบบคาสเคด (ภาคอุณหภูมิต่ำ) · ห้องทดสอบสภาพแวดล้อม
    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    ORAFON R-23 เป็นสารทำความเย็นประเภท HFC แบบสารเดี่ยว หมายเลข ASHRAE R-23 ส่วนผสม CHF₃ (Trifluoromethane) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 14800 และ ODP 0

    สาร HFC ชนิดเดี่ยว ไม่ติดไฟ (A1) จุดเดือดต่ำมาก ใช้ในระบบทำความเย็นอุณหภูมิต่ำพิเศษ เช่น ภาคอุณหภูมิต่ำของระบบคาสเคด ตู้แช่แข็งห้องแล็บ และห้องทดสอบ มีค่า GWP สูงมาก

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-23 ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-13 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
  seo_description: ORAFON R-23 สารทำความเย็น R-23 HFC A1 GWP 14800 จัดจำหน่ายโดย ORAFON ขอใบเสนอราคาได้
en:
  name: ORAFON R-23
  tagline: Ultra-low-temperature HFC refrigerant
  tag: ""
  badges:
    - GWP 14800
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-23 is a single-component, non-flammable (A1) HFC with a very low boiling point, used for ultra-low-temperature refrigeration such as the low stage of cascade systems, laboratory freezers and test chambers. Very high GWP.
  highlights:
    - title: GWP 14800
      text: GWP (AR4) 14800 · ODP 0
    - title: HFC
      text: Single component · CHF₃ (Trifluoromethane)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-13
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Laboratory freezers · Cascade low stage · Environmental test chambers
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-23 is an HFC refrigerant (single component), ASHRAE number R-23, composition CHF₃ (Trifluoromethane). It is classified A1 under ASHRAE 34, with GWP (AR4) 14800 and ODP 0.

    A single-component, non-flammable (A1) HFC with a very low boiling point, used for ultra-low-temperature refrigeration such as the low stage of cascade systems, laboratory freezers and test chambers. Very high GWP.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-23 replace?
      a: R-13. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-23 R-23 HFC refrigerant, A1, GWP 14800. Distributed by ORAFON — request a quotation.
