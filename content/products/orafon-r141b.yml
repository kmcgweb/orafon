en:
  name: ORAFON R-141b
  tagline: HCFC flushing & blowing agent
  tag: ""
  badges:
    - GWP 725
    - A2 flammable
    - ODP = 0.11
  short: ORAFON R-141b is a single-component HCFC that is liquid at room temperature, used for flushing refrigeration piping before recharging and as a foam blowing agent. Flammable (A2) and being phased out under the Montreal Protocol.
  highlights:
    - title: GWP 725
      text: GWP (AR4) 725 · ODP 0.11
    - title: HCFC
      text: Single component · CH₃CCl₂F (1,1-Dichloro-1-fluoroethane)
    - title: A2 flammable
      text: Flammable — store away from heat and ignition sources, use with good ventilation
    - title: For servicing existing systems
      text: Being phased out under the Montreal Protocol
    - title: Applications
      text: System flushing · Metal residue removal · Equipment cleaning
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-141b is an HCFC refrigerant (single component), ASHRAE number R-141b, composition CH₃CCl₂F (1,1-Dichloro-1-fluoroethane). It is classified A2 under ASHRAE 34, with GWP (AR4) 725 and ODP 0.11.

    A single-component HCFC that is liquid at room temperature, used for flushing refrigeration piping before recharging and as a foam blowing agent. Flammable (A2) and being phased out under the Montreal Protocol.

    **Caution:** R-141b is classified A2 (flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    **Note:** HCFCs are being phased out under the Montreal Protocol and imports are controlled. Use for servicing existing systems and plan a long-term move to alternatives.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: What is ORAFON R-141b used for?
      a: System flushing · Foam blowing — now mainly for servicing existing systems.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2 under ASHRAE 34. Flammable: store away from heat and ignition sources, use with good ventilation."
    - q: Can R-141b still be used?
      a: Yes, for servicing existing systems, but it is being phased out under the Montreal Protocol and imports are controlled. Plan a move to alternatives.
    - q: Which pack sizes are available, and how do I get a price?
      a: 30 kg, plus 230 and 250 kg drums (5/8 in valve). Contact the ORAFON team for stock and a quotation via the "Request a quote" button, LINE or phone.
  specs:
    - k: Valve size
      v: 5/8 in
    - k: CAS Number
      v: 1717-00-6
  applications:
    - icon: wrench
      label: Refrigeration system flushing
    - icon: flask
      label: Metal residue removal / equipment cleaning
  seo_description: ORAFON R-141b R-141b HCFC refrigerant, A2, GWP 725. Distributed by ORAFON — request a quotation.
