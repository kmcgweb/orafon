en:
  name: ORAFON POE 32
  tagline: POE compressor oil for air-conditioning
  tag: ''
  specs:
  - k: Viscosity at 40 °C
    v: 32 cSt
  - k: Viscosity at 100 °C
    v: 5.3 cSt
  - k: VI
    v: '94'
  - k: Moisture
    v: 23 ppm
  - k: Acid value
    v: <0.02 mgKOH/g
  short: ORAFON POE 32 is a POE (polyol ester) compressor oil for air-conditioners and systems running low-GWP refrigerants, with high chemical and thermal stability.
  highlights:
  - title: High stability
    text: High chemical and thermal stability
  - title: Wear protection
    text: Excellent protection against wear
  - title: Dedicated formula
    text: Specially formulated for better lubrication
  description: ORAFON POE 32 is a POE (polyol ester) compressor oil for air-conditioners and systems that run on low-GWP refrigerants. It offers high chemical and thermal stability, excellent wear protection and a dedicated formula for better lubrication. Available in 1 L cans.
  applications:
  - icon: ac
    label: Air-conditioners
  - icon: snow
    label: Low-GWP refrigerant systems
