  description: ORAFON POE 32 เป็นน้ำมันคอมเพรสเซอร์ชนิด POE (Polyol Ester) สำหรับเครื่องปรับอากาศ และระบบที่ทำงานร่วมกับสารทำความเย็นที่มีค่า GWP ต่ำ มีเสถียรภาพทางเคมีและความร้อนสูง ป้องกันการสึกหรอได้อย่างดีเยี่ยม และคิดค้นสูตรเฉพาะเพื่อการหล่อลื่นที่ดีขึ้น ขนาดบรรจุ 1 ลิตร
