en:
  name: ORAFON R-1234yf
  tagline: HFO refrigerant for new automotive AC
  tag: ''
  badges:
    - GWP 4
    - A2L mildly flammable
    - ODP = 0
  short: ORAFON R-1234yf is a single-component HFO with ultra-low GWP (4), the standard refrigerant in new automotive AC in place of R-134a. Classified as mildly flammable (A2L).
  highlights:
    - title: GWP 4
      text: GWP (AR4) 4, over 99% lower than R-134a · ODP 0
    - title: HFO
      text: Single component · CH₂=CFCF₃ (2,3,3,3-Tetrafluoropropene)
    - title: A2L mildly flammable
      text: Use with equipment designed for A2L refrigerants and trained technicians
    - title: Replaces R-134a in new vehicles
      text: For systems designed for R-1234yf only, not a drop-in for existing R-134a systems
    - title: Applications
      text: New automotive AC · Selected commercial refrigeration
    - title: TDS/SDS available
      text: Request them from the "Documents" section or the ORAFON team
  description: |-
    ORAFON R-1234yf is an HFO refrigerant (single component), ASHRAE number R-1234yf, composition CH₂=CFCF₃ (2,3,3,3-Tetrafluoropropene). It is classified A2L under ASHRAE 34, with GWP (AR4) 4 and ODP 0.

    It is the standard refrigerant in new automotive AC in place of R-134a. Its ultra-low GWP helps carmakers and workshops meet environmental regulations. Use it only in systems designed for R-1234yf.

    **Caution:** R-1234yf is classified A2L (mildly flammable). Use compatible equipment and tools, and technicians trained to handle this class of refrigerant.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for stock and a quotation.
  applications: []
  faq:
    - q: Can R-1234yf be used to top up a car AC that runs on R-134a?
      a: Not recommended. R-1234yf is for systems designed for it (fittings and components differ). Check the refrigerant label under the bonnet or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: It is classified A2L under ASHRAE 34 (mildly flammable). Use compatible equipment and trained technicians.
    - q: Which pack sizes are available, and how do I get a price?
      a: A 5 kg DAC cylinder. Contact the ORAFON team for stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-1234yf HFO refrigerant for new automotive AC, A2L, GWP 4, 5 kg DAC cylinder. Distributed by ORAFON — request a quotation.
