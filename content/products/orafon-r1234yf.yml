  faq:
    - q: ใช้ R-1234yf เติมแทนในแอร์รถที่ใช้ R-134a ได้ไหม?
      a: ไม่แนะนำ R-1234yf ใช้กับระบบที่ออกแบบมาสำหรับสารนี้โดยเฉพาะ (หัวเติมและอุปกรณ์ต่างกัน) ควรตรวจสอบป้ายระบุสารในห้องเครื่องหรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A2L ตามมาตรฐาน ASHRAE 34 ติดไฟได้เล็กน้อย ต้องใช้อุปกรณ์ที่รองรับและช่างที่ผ่านการอบรม
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: มีถัง DAC ขนาด 5 kg ติดต่อทีม ORAFON เพื่อสอบถามสต็อกและขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
