    - title: แทน R-134a ในรถรุ่นใหม่
      text: ใช้กับระบบที่ออกแบบมาสำหรับ R-1234yf เท่านั้น ไม่ใช่สารเติมแทนในระบบ R-134a เดิม
    - title: งานที่เหมาะ
      text: แอร์รถยนต์รุ่นใหม่ · ตู้แช่เชิงพาณิชย์บางประเภท
