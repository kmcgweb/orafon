en:
  name: ORAFON R-417A
  tagline: HFC Blend refrigerant
  tag: R-22 retrofit
  badges:
    - GWP 2346
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-417A is a zeotropic, non-flammable (A1) HFC blend designed as a retrofit replacement for R-22 in existing AC and refrigeration systems; in many cases it works with the existing compressor oil (confirm with the equipment manufacturer).
  highlights:
    - title: GWP 2346
      text: GWP (AR4) 2346 · ODP 0
    - title: HFC Blend
      text: Zeotropic blend (with temperature glide) · R-125 / R-134a / R-600 (46.6/50/3.4)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Existing AC (retrofit) · Cold rooms · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-417A is an HFC Blend refrigerant (zeotropic blend), ASHRAE number R-417A, composition R-125 / R-134a / R-600 (46.6/50/3.4). It is classified A1 under ASHRAE 34, with GWP (AR4) 2346 and ODP 0.

    A zeotropic, non-flammable (A1) HFC blend designed as a retrofit replacement for R-22 in existing AC and refrigeration systems; in many cases it works with the existing compressor oil (confirm with the equipment manufacturer).

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-417A replace?
      a: R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-417A R-417A HFC Blend refrigerant, A1, GWP 2346. Distributed by ORAFON — request a quotation.
