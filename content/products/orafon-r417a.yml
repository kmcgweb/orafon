  short: ORAFON R-417A — สาร HFC ผสมแบบซีโอโทรป ไม่ติดไฟ (A1) ออกแบบเป็นสารรีโทรฟิตแทน R-22 ในระบบปรับอากาศและทำความเย็นเดิม ในหลายกรณีใช้กับน้ำมันคอมเพรสเซอร์เดิมได้ (ควรตรวจสอบกับผู้ผลิตอุปกรณ์)
