    - title: ลด GWP 45%
      text: ค่า GWP (AR4) 2140 ต่ำกว่า R-404A ราว 45% · ODP 0
    - title: HFO Blend
      text: สารผสมซีโอโทรป (มี temperature glide) · R-32 / R-125 / R-1234yf (11/59/30)
    - title: A1 ไม่ติดไฟ
      text: ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - title: ใช้ทดแทน R-404A
      text: ทั้งงานติดตั้งใหม่และงานเปลี่ยนสาร (ตรวจสอบกับผู้ผลิตอุปกรณ์)
    - title: งานที่เหมาะ
      text: รถห้องเย็น · ตู้คอนเทนเนอร์ห้องเย็น · ห้องเย็นขนาดเล็ก
    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    Solstice® R-452A เป็นสารทำความเย็นประเภท HFO Blend แบบสารผสมซีโอโทรป หมายเลข ASHRAE R-452A ส่วนผสม R-32 / R-125 / R-1234yf (11/59/30) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 2140 และ ODP 0

    สาร HFO/HFC ผสม ไม่ติดไฟ (A1) ออกแบบสำหรับระบบทำความเย็นในการขนส่ง เช่น รถห้องเย็นและตู้คอนเทนเนอร์ ใช้แทน R-404A โดยให้อุณหภูมิขาออกคอมเพรสเซอร์ใกล้เคียงเดิม และค่า GWP ต่ำกว่า R-404A ราว 45%

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-452A ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
