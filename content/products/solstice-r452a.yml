en:
  name: Solstice® R-452A
  tagline: HFO Blend refrigerant
  tag: ""
  badges:
    - 45% lower GWP vs R-404A
    - A1 non-flammable
    - ODP = 0
  short: Solstice® R-452A is a non-flammable (A1) HFO/HFC blend designed for transport refrigeration such as reefer trucks and containers, replacing R-404A with similar compressor discharge temperatures and about 45% lower GWP.
  highlights:
    - title: 45% lower GWP
      text: GWP (AR4) 2140, about 45% below R-404A · ODP 0
    - title: HFO Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-125 / R-1234yf (11/59/30)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-404A
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Refrigerated trucks · Reefer containers · Small cold rooms
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-452A is an HFO Blend refrigerant (zeotropic blend), ASHRAE number R-452A, composition R-32 / R-125 / R-1234yf (11/59/30). It is classified A1 under ASHRAE 34, with GWP (AR4) 2140 and ODP 0.

    A non-flammable (A1) HFO/HFC blend designed for transport refrigeration such as reefer trucks and containers, replacing R-404A with similar compressor discharge temperatures and about 45% lower GWP.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-452A replace?
      a: R-404A. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-452A R-452A HFO Blend refrigerant, A1, GWP 2140. Distributed by ORAFON — request a quotation.
