  short: Solstice® R-452A — สาร HFO/HFC ผสม ไม่ติดไฟ (A1) ออกแบบสำหรับระบบทำความเย็นในการขนส่ง เช่น รถห้องเย็นและตู้คอนเทนเนอร์ ใช้แทน R-404A โดยให้อุณหภูมิขาออกคอมเพรสเซอร์ใกล้เคียงเดิม และค่า GWP ต่ำกว่า R-404A ราว 45%
