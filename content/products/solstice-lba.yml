  description: |-
    Solstice® LBA (HFO-1233zd(E)) เป็นสารทำความเย็นประเภท HFO แบบสารเดี่ยว หมายเลข ASHRAE R-1233zd(E) ส่วนผสม CF₃CH=CHCl — HCFO-1233zd(E) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 1 และ ODP ~0.0003

    สาร HCFO-1233zd(E) ชนิดเดี่ยว ไม่ติดไฟ (A1) ค่า GWP ประมาณ 1 และ ODP ใกล้ศูนย์ เป็นของเหลวที่อุณหภูมิห้อง ใช้เป็นสารเป่าโฟมฉนวน (Liquid Blowing Agent) และเป็นสารทำความเย็นในชิลเลอร์แรงดันต่ำ

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® LBA (HFO-1233zd(E)) ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-141b, R-245fa, R-123 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
