en:
  name: Solstice® LBA (HFO-1233zd(E))
  tagline: HFO liquid blowing agent & refrigerant
  tag: GWP ≈ 1
  badges:
    - 99% lower GWP vs R-141b
    - A1 non-flammable
    - ODP = ~0.0003
  short: Solstice® LBA (HFO-1233zd(E)) is a single-component, non-flammable (A1) HCFO-1233zd(E) with GWP around 1 and near-zero ODP. Liquid at room temperature; used as a liquid blowing agent for insulation foam and as a refrigerant in low-pressure chillers.
  highlights:
    - title: 99% lower GWP
      text: GWP (AR4) 1, about 99% below R-141b · ODP ~0.0003
    - title: HFO
      text: Single component · CF₃CH=CHCl — HCFO-1233zd(E)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-141b, R-245fa, R-123
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: PU insulation foam · Low-pressure chillers · ORC systems
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® LBA (HFO-1233zd(E)) is an HFO refrigerant (single component), ASHRAE number R-1233zd(E), composition CF₃CH=CHCl — HCFO-1233zd(E). It is classified A1 under ASHRAE 34, with GWP (AR4) 1 and ODP ~0.0003.

    A single-component, non-flammable (A1) HCFO-1233zd(E) with GWP around 1 and near-zero ODP. Liquid at room temperature; used as a liquid blowing agent for insulation foam and as a refrigerant in low-pressure chillers.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® LBA (HFO-1233zd(E)) replace?
      a: R-141b, R-245fa, R-123. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® LBA (HFO-1233zd(E)) R-1233zd(E) HFO refrigerant, A1, GWP 1. Distributed by ORAFON — request a quotation.
