  short: ORAFON POE 68 is a POE (polyol ester) compressor oil for air-conditioners and systems running low-GWP refrigerants, with high chemical and thermal stability.
  highlights:
  - title: High stability
    text: High chemical and thermal stability
  - title: Wear protection
    text: Excellent protection against wear
  - title: Dedicated formula
    text: Specially formulated for better lubrication
  description: ORAFON POE 68 is a POE (polyol ester) compressor oil for air-conditioners and systems that run on low-GWP refrigerants. It offers high chemical and thermal stability, excellent wear protection and a dedicated formula for better lubrication. Available in 1 L cans.
