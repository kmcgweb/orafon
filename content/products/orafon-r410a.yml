en:
  name: ORAFON R-410A
  tagline: HFC Blend refrigerant
  tag: ""
  badges:
    - GWP 2088
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-410A is a near-azeotropic, non-flammable (A1) HFC blend widely used in air conditioners and heat pumps designed for R-410A. Operates at higher pressure than R-22.
  highlights:
    - title: GWP 2088
      text: GWP (AR4) 2088 · ODP 0
    - title: HFC Blend
      text: Near-azeotropic blend · R-32 / R-125 (50/50)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Residential AC · Commercial AC / VRF · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-410A is an HFC Blend refrigerant (near-azeotropic blend), ASHRAE number R-410A, composition R-32 / R-125 (50/50). It is classified A1 under ASHRAE 34, with GWP (AR4) 2088 and ODP 0.

    A near-azeotropic, non-flammable (A1) HFC blend widely used in air conditioners and heat pumps designed for R-410A. Operates at higher pressure than R-22.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-410A replace?
      a: R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-410A R-410A HFC Blend refrigerant, A1, GWP 2088. Distributed by ORAFON — request a quotation.
