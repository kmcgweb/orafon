      text: สารผสมแบบ Zeotropic (มี temperature glide) · R-744 / R-32 / R-1234yf (3/21.5/75.5)
    - title: A2L ติดไฟได้เล็กน้อย
      text: ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - title: ใช้ทดแทน R-404A
      text: ในอุปกรณ์ใหม่ที่ออกแบบสำหรับสารกลุ่ม A2L (ไม่ใช่สารเติมแทน)
    - title: งานที่เหมาะ
      text: ชุดคอนเดนซิ่ง · ตู้แช่ / ตู้โชว์ · ห้องเย็นขนาดเล็ก
    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    Solstice® R-455A เป็นสารทำความเย็นประเภท HFO Blend แบบ Zeotropic หมายเลข ASHRAE R-455A ส่วนผสม R-744 / R-32 / R-1234yf (3/21.5/75.5) จัดอยู่ในกลุ่มความปลอดภัย A2L ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 148 และ ODP 0

    สาร HFO ผสมที่มี CO₂ เป็นส่วนประกอบ ค่า GWP ต่ำมาก (ต่ำกว่า 150) สำหรับชุดคอนเดนซิ่งและระบบทำความเย็นเชิงพาณิชย์รุ่นใหม่ที่ออกแบบสำหรับสารกลุ่ม A2L ใช้แทน R-404A

    **ข้อควรระวัง:** R-455A จัดอยู่ในกลุ่ม A2L (ติดไฟได้เล็กน้อย) ต้องใช้กับอุปกรณ์ที่ออกแบบมาสำหรับสารกลุ่มนี้เท่านั้น ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1 และควรให้ช่างที่ผ่านการอบรมเป็นผู้ดำเนินการ

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-455A ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A ในอุปกรณ์ที่ออกแบบสำหรับสารกลุ่ม A2L ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A2L ตามมาตรฐาน ASHRAE 34 ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
