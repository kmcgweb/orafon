en:
  name: Solstice® R-455A
  tagline: HFO Blend refrigerant
  tag: Ultra-low GWP
  badges:
    - 96% lower GWP vs R-404A
    - A2L mildly flammable
    - ODP = 0
  short: Solstice® R-455A is an HFO blend containing CO₂ with very low GWP (below 150) for new condensing units and commercial refrigeration designed for A2L refrigerants, replacing R-404A.
  highlights:
    - title: 96% lower GWP
      text: GWP (AR4) 148, about 96% below R-404A · ODP 0
    - title: HFO Blend
      text: Zeotropic blend (with temperature glide) · R-744 / R-32 / R-1234yf (3/21.5/75.5)
    - title: A2L mildly flammable
      text: Mildly flammable — use only in equipment designed for A2L
    - title: Replaces R-404A
      text: In new equipment designed for A2L (not a drop-in)
    - title: Applications
      text: Condensing units · Display cabinets · Small cold rooms
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-455A is an HFO Blend refrigerant (zeotropic blend), ASHRAE number R-455A, composition R-744 / R-32 / R-1234yf (3/21.5/75.5). It is classified A2L under ASHRAE 34, with GWP (AR4) 148 and ODP 0.

    An HFO blend containing CO₂ with very low GWP (below 150) for new condensing units and commercial refrigeration designed for A2L refrigerants, replacing R-404A.

    **Caution:** R-455A is classified A2L (mildly flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-455A replace?
      a: R-404A, in equipment designed for A2L refrigerants. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2L under ASHRAE 34. Mildly flammable: use only in equipment designed for A2L."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-455A R-455A HFO Blend refrigerant, A2L, GWP 148. Distributed by ORAFON — request a quotation.
