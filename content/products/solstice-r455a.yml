  short: Solstice® R-455A — สาร HFO ผสมที่มี CO₂ เป็นส่วนประกอบ ค่า GWP ต่ำมาก (ต่ำกว่า 150) สำหรับชุดคอนเดนซิ่งและระบบทำความเย็นเชิงพาณิชย์รุ่นใหม่ที่ออกแบบสำหรับสารกลุ่ม A2L ใช้แทน R-404A
  highlights:
