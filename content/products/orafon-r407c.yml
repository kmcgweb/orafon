en:
  name: ORAFON R-407C
  tagline: HFC Blend refrigerant
  tag: ""
  badges:
    - GWP 1774
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-407C is a zeotropic, non-flammable (A1) HFC blend with properties close to R-22, commonly used to replace R-22 in air conditioning and chillers. Charge as liquid because of its temperature glide.
  highlights:
    - title: GWP 1774
      text: GWP (AR4) 1774 · ODP 0
    - title: HFC Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-125 / R-134a (23/25/52)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Commercial AC · Chillers · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-407C is an HFC Blend refrigerant (zeotropic blend), ASHRAE number R-407C, composition R-32 / R-125 / R-134a (23/25/52). It is classified A1 under ASHRAE 34, with GWP (AR4) 1774 and ODP 0.

    A zeotropic, non-flammable (A1) HFC blend with properties close to R-22, commonly used to replace R-22 in air conditioning and chillers. Charge as liquid because of its temperature glide.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-407C replace?
      a: R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-407C R-407C HFC Blend refrigerant, A1, GWP 1774. Distributed by ORAFON — request a quotation.
