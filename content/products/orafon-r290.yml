  short: ORAFON R-290 — สารทำความเย็นธรรมชาติกลุ่มไฮโดรคาร์บอน ค่า GWP ต่ำมาก ใช้ในแอร์ขนาดเล็ก ตู้แช่ ตู้โชว์ และฮีตปั๊มรุ่นใหม่ที่ออกแบบสำหรับ R-290 จัดอยู่ในกลุ่มติดไฟได้สูง (A3) ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1
  highlights:
    - title: ลด GWP 99%
      text: ค่า GWP (AR4) 3 ต่ำกว่า R-22 ราว 99% · ODP 0
    - title: HC
      text: สารเดี่ยว · C₃H₈ (Propane)
    - title: A3 ติดไฟได้สูง
      text: ติดไฟได้สูง ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A3 เท่านั้น และต้องให้ช่างที่ผ่านการอบรม
    - title: ใช้ทดแทน R-22, R-404A
      text: ในอุปกรณ์ใหม่ที่ออกแบบสำหรับสารกลุ่ม A3 (ไม่ใช่สารเติมแทน)
    - title: งานที่เหมาะ
      text: แอร์ขนาดเล็ก · ตู้แช่ / ตู้โชว์ · ฮีตปั๊ม
    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    ORAFON R-290 เป็นสารทำความเย็นประเภท HC แบบสารเดี่ยว หมายเลข ASHRAE R-290 ส่วนผสม C₃H₈ (Propane) จัดอยู่ในกลุ่มความปลอดภัย A3 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 3 และ ODP 0

    สารทำความเย็นธรรมชาติกลุ่มไฮโดรคาร์บอน ค่า GWP ต่ำมาก ใช้ในแอร์ขนาดเล็ก ตู้แช่ ตู้โชว์ และฮีตปั๊มรุ่นใหม่ที่ออกแบบสำหรับ R-290 จัดอยู่ในกลุ่มติดไฟได้สูง (A3) ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1

    **ข้อควรระวัง:** R-290 จัดอยู่ในกลุ่ม A3 (ติดไฟได้สูง) ต้องใช้กับอุปกรณ์ที่ออกแบบมาสำหรับสารกลุ่มนี้เท่านั้น ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1 และควรให้ช่างที่ผ่านการอบรมเป็นผู้ดำเนินการ

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-290 ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-22, R-404A ในอุปกรณ์ที่ออกแบบสำหรับสารกลุ่ม A3 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A3 ตามมาตรฐาน ASHRAE 34 ติดไฟได้สูง ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A3 เท่านั้น และต้องให้ช่างที่ผ่านการอบรม
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
