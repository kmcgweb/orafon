en:
  name: ORAFON R-290
  tagline: Natural refrigerant (propane)
  tag: Natural
  badges:
    - 99% lower GWP vs R-22
    - A3 highly flammable
    - ODP = 0
  short: "ORAFON R-290 is a natural hydrocarbon refrigerant with very low GWP, used in small air conditioners, display cabinets, freezers and heat pumps designed for R-290. Highly flammable (A3): never use as a replacement in systems designed for A1 refrigerants."
  highlights:
    - title: 99% lower GWP
      text: GWP (AR4) 3, about 99% below R-22 · ODP 0
    - title: HC
      text: Single component · C₃H₈ (Propane)
    - title: A3 highly flammable
      text: Highly flammable — only for equipment designed for A3, handled by trained technicians
    - title: Replaces R-22, R-404A
      text: In new equipment designed for A3 (not a drop-in)
    - title: Applications
      text: Small air conditioners · Display cabinets · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-290 is an HC refrigerant (single component), ASHRAE number R-290, composition C₃H₈ (Propane). It is classified A3 under ASHRAE 34, with GWP (AR4) 3 and ODP 0.

    A natural hydrocarbon refrigerant with very low GWP, used in small air conditioners, display cabinets, freezers and heat pumps designed for R-290. Highly flammable (A3): never use as a replacement in systems designed for A1 refrigerants.

    **Caution:** R-290 is classified A3 (highly flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-290 replace?
      a: R-22, R-404A, in equipment designed for A3 refrigerants. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A3 under ASHRAE 34. Highly flammable: only for equipment designed for A3, handled by trained technicians."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-290 R-290 HC refrigerant, A3, GWP 3. Distributed by ORAFON — request a quotation.
