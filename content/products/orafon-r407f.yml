en:
  name: ORAFON R-407F
  tagline: HFC Blend refrigerant
  tag: ""
  badges:
    - 53% lower GWP vs R-404A
    - A1 non-flammable
    - ODP = 0
  short: ORAFON R-407F is a zeotropic, non-flammable (A1) HFC blend with roughly half the GWP of R-404A, popular in supermarket refrigeration for new systems and retrofits from R-404A and R-22.
  highlights:
    - title: 53% lower GWP
      text: GWP (AR4) 1825, about 53% below R-404A · ODP 0
    - title: HFC Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-125 / R-134a (30/30/40)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: Replaces R-404A, R-22
      text: New systems and conversions (confirm with the equipment manufacturer)
    - title: Applications
      text: Supermarkets · Display cabinets · Cold rooms
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-407F is an HFC Blend refrigerant (zeotropic blend), ASHRAE number R-407F, composition R-32 / R-125 / R-134a (30/30/40). It is classified A1 under ASHRAE 34, with GWP (AR4) 1825 and ODP 0.

    A zeotropic, non-flammable (A1) HFC blend with roughly half the GWP of R-404A, popular in supermarket refrigeration for new systems and retrofits from R-404A and R-22.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-407F replace?
      a: R-404A, R-22. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-407F R-407F HFC Blend refrigerant, A1, GWP 1825. Distributed by ORAFON — request a quotation.
