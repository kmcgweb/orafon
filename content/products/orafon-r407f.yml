  description: |-
    ORAFON R-407F เป็นสารทำความเย็นประเภท HFC Blend แบบ Zeotropic หมายเลข ASHRAE R-407F ส่วนผสม R-32 / R-125 / R-134a (30/30/40) จัดอยู่ในกลุ่มความปลอดภัย A1 ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 1825 และ ODP 0

    สาร HFC ผสมแบบ Zeotropic ไม่ติดไฟ (A1) ค่า GWP ต่ำกว่า R-404A ประมาณครึ่งหนึ่ง นิยมใช้ในระบบทำความเย็นซูเปอร์มาร์เก็ตทั้งงานใหม่และงาน Retrofit จาก R-404A และ R-22

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-407F ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-404A, R-22 ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A1 ตามมาตรฐาน ASHRAE 34 ไม่ติดไฟ ความเป็นพิษต่ำ จัดการได้ตามแนวทางที่ช่างคุ้นเคย
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
