      text: ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - title: ใช้ทดแทน R-410A, R-22
      text: ในอุปกรณ์ใหม่ที่ออกแบบสำหรับสารกลุ่ม A2L (ไม่ใช่สารเติมแทน)
    - title: งานที่เหมาะ
      text: แอร์บ้าน · แอร์เชิงพาณิชย์ · ฮีตปั๊ม
    - title: เอกสาร TDS/SDS
      text: ขอรับได้ที่แท็บ "เอกสาร" หรือทีม ORAFON
  description: |-
    ORAFON R-32 เป็นสารทำความเย็นประเภท HFC แบบสารเดี่ยว หมายเลข ASHRAE R-32 ส่วนผสม CH₂F₂ (Difluoromethane) จัดอยู่ในกลุ่มความปลอดภัย A2L ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 675 และ ODP 0

    สาร HFC ชนิดเดี่ยว ค่า GWP ต่ำกว่า R-410A ประมาณสองในสาม นิยมใช้ในเครื่องปรับอากาศบ้านและเชิงพาณิชย์รุ่นใหม่ จัดอยู่ในกลุ่มติดไฟได้เล็กน้อย (A2L) ต้องติดตั้งตามมาตรฐานความปลอดภัย

    **ข้อควรระวัง:** R-32 จัดอยู่ในกลุ่ม A2L (ติดไฟได้เล็กน้อย) ต้องใช้กับอุปกรณ์ที่ออกแบบมาสำหรับสารกลุ่มนี้เท่านั้น ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1 และควรให้ช่างที่ผ่านการอบรมเป็นผู้ดำเนินการ

    สินค้าแบรนด์ ORAFON ของ บริษัท โอราโนส จำกัด พร้อมเอกสาร TDS/SDS และคำปรึกษาจากทีมงานในการเลือกสารให้เหมาะกับระบบ ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: ORAFON R-32 ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-410A, R-22 ในอุปกรณ์ที่ออกแบบสำหรับสารกลุ่ม A2L ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A2L ตามมาตรฐาน ASHRAE 34 ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
