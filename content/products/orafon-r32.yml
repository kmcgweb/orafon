en:
  name: ORAFON R-32
  tagline: HFC refrigerant
  tag: ""
  badges:
    - 68% lower GWP vs R-410A
    - A2L mildly flammable
    - ODP = 0
  short: ORAFON R-32 is a single-component HFC with roughly one-third the GWP of R-410A, widely used in new residential and commercial air conditioners. Classified as mildly flammable (A2L); install according to safety standards.
  highlights:
    - title: 68% lower GWP
      text: GWP (AR4) 675, about 68% below R-410A · ODP 0
    - title: HFC
      text: Single component · CH₂F₂ (Difluoromethane)
    - title: A2L mildly flammable
      text: Mildly flammable — use only in equipment designed for A2L
    - title: Replaces R-410A, R-22
      text: In new equipment designed for A2L (not a drop-in)
    - title: Applications
      text: Residential AC · Commercial AC · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-32 is an HFC refrigerant (single component), ASHRAE number R-32, composition CH₂F₂ (Difluoromethane). It is classified A2L under ASHRAE 34, with GWP (AR4) 675 and ODP 0.

    A single-component HFC with roughly one-third the GWP of R-410A, widely used in new residential and commercial air conditioners. Classified as mildly flammable (A2L); install according to safety standards.

    **Caution:** R-32 is classified A2L (mildly flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can ORAFON R-32 replace?
      a: R-410A, R-22, in equipment designed for A2L refrigerants. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2L under ASHRAE 34. Mildly flammable: use only in equipment designed for A2L."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-32 R-32 HFC refrigerant, A2L, GWP 675. Distributed by ORAFON — request a quotation.
