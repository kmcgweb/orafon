en:
  name: ORAFON PAG 46 A
  tagline: PAG compressor oil for automotive A/C
  tag: ''
  specs:
  - k: Viscosity at 40 °C
    v: 46 cSt
  - k: Viscosity at 100 °C
    v: 8.6 cSt
  - k: VI
    v: '184'
  - k: Capping efficiency
    v: 95%
  short: ORAFON PAG 46 A is a PAG (polyalkylene glycol) compressor oil for automotive air-conditioning, with excellent lubrication and wear protection and twice the standard resistance to moisture absorption.
  highlights:
  - title: PAG formula
    text: Special polyalkylene glycol blend
  - title: Excellent lubrication
    text: Outstanding lubrication and wear protection
  - title: Moisture resistant
    text: Resists moisture absorption twice as well as the standard
  description: |-
    ORAFON PAG 46 A is a PAG (polyalkylene glycol) compressor oil for automotive air-conditioning systems. Its special polyalkylene glycol blend gives excellent lubrication and wear protection, and it resists moisture absorption twice as well as the standard.

    Viscosity 46 cSt at 40 °C and 8.6 cSt at 100 °C, VI 184, capping efficiency 95%. Available in 250 ml and 1 L cans.
  applications:
  - icon: car
    label: Automotive A/C
  seo_description: ORAFON PAG 46 A PAG compressor oil for automotive A/C, 250 ml and 1 L, from ORAFON — request a quotation.
