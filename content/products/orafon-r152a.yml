  name: ORAFON R-152a
  tagline: HFC aerosol propellant & blend component
  tag: ""
  badges:
    - GWP 124
    - A2 flammable
    - ODP = 0
  short: ORAFON R-152a is a single-component, low-GWP HFC used as an aerosol propellant and as a component of refrigerant blends. Flammable (A2).
  highlights:
    - title: GWP 124
      text: GWP (AR4) 124 · ODP 0
    - title: HFC
      text: Single component · CH₃CHF₂ (1,1-Difluoroethane)
    - title: A2 flammable
      text: Flammable — store away from heat and ignition sources, use with good ventilation
    - title: Specialist use
      text: Aerosol propellant · Blend component
    - title: Applications
      text: Aerosol propellant · Blend component
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-152a is an HFC refrigerant (single component), ASHRAE number R-152a, composition CH₃CHF₂ (1,1-Difluoroethane). It is classified A2 under ASHRAE 34, with GWP (AR4) 124 and ODP 0.

    A single-component, low-GWP HFC used as an aerosol propellant and as a component of refrigerant blends. Flammable (A2).

    **Caution:** R-152a is classified A2 (flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: What is ORAFON R-152a used for?
      a: Aerosol propellant · Blend component — ask the ORAFON team to choose the right product for your job.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2 under ASHRAE 34. Flammable: store away from heat and ignition sources, use with good ventilation."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-152a R-152a HFC refrigerant, A2, GWP 124. Distributed by ORAFON — request a quotation.
