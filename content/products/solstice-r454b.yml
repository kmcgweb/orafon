  description: |-
    Solstice® R-454B เป็นสารทำความเย็นประเภท HFO Blend แบบสารผสมซีโอโทรป หมายเลข ASHRAE R-454B ส่วนผสม R-32 / R-1234yf (68.9/31.1) จัดอยู่ในกลุ่มความปลอดภัย A2L ตามมาตรฐาน ASHRAE 34 มีค่า GWP (AR4) 466 และ ODP 0

    สาร HFO/HFC ผสม ค่า GWP ต่ำกว่า R-410A ราว 78% สำหรับเครื่องปรับอากาศและฮีตปั๊มรุ่นใหม่ที่ออกแบบมาสำหรับสารนี้ จัดอยู่ในกลุ่มติดไฟได้เล็กน้อย (A2L) ไม่ใช่สารเติมแทนในระบบ R-410A เดิม

    **ข้อควรระวัง:** R-454B จัดอยู่ในกลุ่ม A2L (ติดไฟได้เล็กน้อย) ต้องใช้กับอุปกรณ์ที่ออกแบบมาสำหรับสารกลุ่มนี้เท่านั้น ห้ามเติมแทนในระบบที่ออกแบบสำหรับสาร A1 และควรให้ช่างที่ผ่านการอบรมเป็นผู้ดำเนินการ

    จัดจำหน่ายในประเทศไทยโดย ORAFON (บริษัท โอราโนส จำกัด) ตัวแทนจำหน่าย Solstice® พร้อมเอกสาร TDS/SDS และคำปรึกษาทางเทคนิค ติดต่อเพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา
  applications: []
  faq:
    - q: Solstice® R-454B ใช้ทดแทนสารตัวไหนได้บ้าง?
      a: ใช้ทดแทน R-410A ในอุปกรณ์ที่ออกแบบสำหรับสารกลุ่ม A2L ก่อนเปลี่ยนสารควรตรวจสอบความเข้ากันได้ของน้ำมันคอมเพรสเซอร์และอุปกรณ์กับผู้ผลิต หรือปรึกษาทีม ORAFON
    - q: ติดไฟหรือไม่ ปลอดภัยแค่ไหน?
      a: จัดอยู่ในกลุ่ม A2L ตามมาตรฐาน ASHRAE 34 ติดไฟได้เล็กน้อย ใช้กับอุปกรณ์ที่ออกแบบสำหรับสาร A2L เท่านั้น
    - q: มีขนาดบรรจุอะไรบ้าง ขอราคาอย่างไร?
      a: ติดต่อทีม ORAFON เพื่อสอบถามขนาดบรรจุ สต็อก และขอใบเสนอราคา ผ่านปุ่ม "ขอใบเสนอราคา" LINE หรือโทรศัพท์
