en:
  name: Solstice® R-454B
  tagline: HFO Blend refrigerant
  tag: Low GWP
  badges:
    - 78% lower GWP vs R-410A
    - A2L mildly flammable
    - ODP = 0
  short: Solstice® R-454B is an HFO/HFC blend with about 78% lower GWP than R-410A for new air conditioners and heat pumps designed for it. Mildly flammable (A2L); not a drop-in for existing R-410A systems.
  highlights:
    - title: 78% lower GWP
      text: GWP (AR4) 466, about 78% below R-410A · ODP 0
    - title: HFO Blend
      text: Zeotropic blend (with temperature glide) · R-32 / R-1234yf (68.9/31.1)
    - title: A2L mildly flammable
      text: Mildly flammable — use only in equipment designed for A2L
    - title: Replaces R-410A
      text: In new equipment designed for A2L (not a drop-in)
    - title: Applications
      text: New residential AC · New commercial AC · Heat pumps
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    Solstice® R-454B is an HFO Blend refrigerant (zeotropic blend), ASHRAE number R-454B, composition R-32 / R-1234yf (68.9/31.1). It is classified A2L under ASHRAE 34, with GWP (AR4) 466 and ODP 0.

    An HFO/HFC blend with about 78% lower GWP than R-410A for new air conditioners and heat pumps designed for it. Mildly flammable (A2L); not a drop-in for existing R-410A systems.

    **Caution:** R-454B is classified A2L (mildly flammable). Use it only in equipment designed for this class, never as a replacement in systems designed for A1 refrigerants, and have trained technicians handle it.

    Distributed in Thailand by ORAFON (Oranoss Co., Ltd.), an authorized Solstice® distributor, with TDS/SDS documents and technical support. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: Which refrigerants can Solstice® R-454B replace?
      a: R-410A, in equipment designed for A2L refrigerants. Before converting, check compressor oil and equipment compatibility with the manufacturer or ask the ORAFON team.
    - q: Is it flammable? How safe is it?
      a: "It is classified A2L under ASHRAE 34. Mildly flammable: use only in equipment designed for A2L."
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: Solstice® R-454B R-454B HFO Blend refrigerant, A2L, GWP 466. Distributed by ORAFON — request a quotation.
