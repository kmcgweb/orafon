  short: ORAFON R-22 is a single-component, non-flammable (A1) HCFC that was the mainstay of older air conditioners and cold rooms. Because it depletes ozone it is being phased out under the Montreal Protocol and is now mainly used to service existing systems.
  highlights:
    - title: GWP 1810
      text: GWP (AR4) 1810 · ODP 0.055
    - title: HCFC
      text: Single component · CHClF₂ (Chlorodifluoromethane)
    - title: A1 non-flammable
      text: Non-flammable and lower toxicity — familiar handling practices
    - title: For servicing existing systems
      text: Being phased out under the Montreal Protocol
    - title: Applications
      text: Legacy residential AC · Legacy commercial AC · Cold rooms
    - title: TDS/SDS available
      text: Request them from the "Documents" tab or the ORAFON team
  description: |-
    ORAFON R-22 is an HCFC refrigerant (single component), ASHRAE number R-22, composition CHClF₂ (Chlorodifluoromethane). It is classified A1 under ASHRAE 34, with GWP (AR4) 1810 and ODP 0.055.

    A single-component, non-flammable (A1) HCFC that was the mainstay of older air conditioners and cold rooms. Because it depletes ozone it is being phased out under the Montreal Protocol and is now mainly used to service existing systems.

    **Note:** HCFCs are being phased out under the Montreal Protocol and imports are controlled. Use for servicing existing systems and plan a long-term move to alternatives.

    An ORAFON-brand product from Oranoss Co., Ltd., backed by TDS/SDS documents and technical advice on choosing the right refrigerant. Contact us for pack sizes, stock and a quotation.
  faq:
    - q: What is ORAFON R-22 used for?
      a: Legacy residential AC · Legacy commercial AC · Cold rooms — now mainly for servicing existing systems.
    - q: Is it flammable? How safe is it?
      a: "It is classified A1 under ASHRAE 34. Non-flammable and lower toxicity: familiar handling practices."
    - q: Can R-22 still be used?
      a: Yes, for servicing existing systems, but it is being phased out under the Montreal Protocol and imports are controlled. Plan a move to alternatives.
    - q: Which pack sizes are available, and how do I get a price?
      a: Contact the ORAFON team for pack sizes, stock and a quotation via the "Request a quote" button, LINE or phone.
  seo_description: ORAFON R-22 R-22 HCFC refrigerant, A1, GWP 1810. Distributed by ORAFON — request a quotation.
