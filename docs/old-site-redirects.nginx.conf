# 301 redirects: old site orafon.oranoss.com -> orafon.co.th
# Paste into Plesk: Websites & Domains -> orafon.oranoss.com -> Apache & nginx Settings
#   -> "Additional nginx directives" -> OK.
# Server-level rewrites run before Plesk's own locations; Let's Encrypt (/.well-known/) is left alone.
# A trailing "?" drops the old query string. Old pages were crawled on 30 Oct 2026 (29 pages).

# Products (old /product/<slug> -> new /products/<slug>/)
rewrite ^/product/orafon-r-22/?$            https://orafon.co.th/products/orafon-r22/? permanent;
rewrite ^/product/orafon-r-23/?$            https://orafon.co.th/products/orafon-r23/? permanent;
rewrite ^/product/orafon-r-32/?$            https://orafon.co.th/products/orafon-r32/? permanent;
rewrite ^/product/orafon-r-134a/?$          https://orafon.co.th/products/orafon-r134a/? permanent;
rewrite ^/product/orafon-r-141b/?$          https://orafon.co.th/products/orafon-r141b/? permanent;
rewrite ^/product/orafon-r-290/?$           https://orafon.co.th/products/orafon-r290/? permanent;
rewrite ^/product/orafon-r-404a/?$          https://orafon.co.th/products/orafon-r404a/? permanent;
rewrite ^/product/orafon-r-407c(-0)?/?$     https://orafon.co.th/products/orafon-r407c/? permanent;
rewrite ^/product/orafon-r-407f/?$          https://orafon.co.th/products/orafon-r407f/? permanent;
rewrite ^/product/orafon-r-410a/?$          https://orafon.co.th/products/orafon-r410a/? permanent;
rewrite ^/product/orafon-r-507a?/?$         https://orafon.co.th/products/orafon-r507a/? permanent;
rewrite ^/product/orafon-r-600a/?$          https://orafon.co.th/products/orafon-r600a/? permanent;
rewrite ^/product/solstice-n40-r-448a/?$    https://orafon.co.th/products/solstice-n40/? permanent;
rewrite ^/product/orafon-premium-pag-46-a/?$  https://orafon.co.th/products/orafon-pag46a/? permanent;
rewrite ^/product/orafon-premium-pag-100-a/?$ https://orafon.co.th/products/orafon-pag100a/? permanent;
rewrite ^/product/orafon-premium-poe-32/?$  https://orafon.co.th/products/orafon-poe32/? permanent;
rewrite ^/product/orafon-premium-poe-68/?$  https://orafon.co.th/products/orafon-poe68/? permanent;
rewrite ^/product/orafon-uv-check/?$        https://orafon.co.th/products/orafon-uv-check/? permanent;
rewrite ^/product/                          https://orafon.co.th/products/? permanent;

# Product categories (Thai and English slugs)
rewrite ^/products/(สารทำความเย็น|refigerant|refrigerant)/?$        https://orafon.co.th/products/?cat=refrigerant? permanent;
rewrite ^/products/(น้ำมันคอม|compressor-lubricant)/?$             https://orafon.co.th/products/?cat=oil? permanent;
rewrite ^/products/(ผลิตภัณฑ์อื่นๆ|others-product)/?$             https://orafon.co.th/products/?cat=other? permanent;
rewrite ^/products                                                https://orafon.co.th/products/? permanent;

# Pages
rewrite ^/aboutus/?$                          https://orafon.co.th/about/? permanent;
rewrite ^/(contactus|complain|find_dealer)/?$ https://orafon.co.th/contact/? permanent;
rewrite ^/term/?$                             https://orafon.co.th/terms/? permanent;
rewrite ^/pdpa/?$                             https://orafon.co.th/privacy/? permanent;
rewrite ^/faqs                                https://orafon.co.th/technical/? permanent;
rewrite ^/(promotion|news|tips|view)          https://orafon.co.th/articles/? permanent;

# Everything else (home, /lang/change, unknown pages) -> home
rewrite ^/(?!\.well-known/) https://orafon.co.th/? permanent;
